name: Media Dependency Lock Once

on:
  push:
    branches:
      - feat/media-processing-variants
    paths:
      - '.github/workflows/media-dependency-lock-once.yml'
      - 'apps/api/package.json'
      - 'apps/worker/package.json'

permissions:
  contents: write

concurrency:
  group: atlas-media-dependency-lock-once
  cancel-in-progress: false

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/media-processing-variants
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Update lockfile and format Media changes
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec prettier --write \
            .env.example \
            apps/api/package.json \
            apps/api/src/media/bullmq-asset-processing.queue.ts \
            apps/api/src/media/media.controller.ts \
            apps/api/src/media/media.module.ts \
            apps/api/src/media/media.tokens.ts \
            apps/worker/package.json \
            packages/config/src/index.ts \
            packages/server/src/asset-processing-queue.test.ts \
            packages/server/src/modules/media/application/asset-upload-coordinator.ts \
            packages/server/src/modules/media/index.ts \
            packages/server/src/modules/media/ports/asset-processing.queue.ts

      - name: Commit generated lockfile and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .env.example \
            apps/api/package.json \
            apps/api/src/media \
            apps/worker/package.json \
            packages/config/src/index.ts \
            packages/server/src/asset-processing-queue.test.ts \
            packages/server/src/modules/media \
            pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi

          git commit -m 'chore: finalize media processing dependencies'
          git push origin HEAD:feat/media-processing-variants
