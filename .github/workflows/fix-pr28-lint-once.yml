name: Fix PR 28 Lint Once

on:
  push:
    branches:
      - feat/media-content-editor-assets

permissions:
  contents: write

concurrency:
  group: atlas-fix-pr28-lint-once
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/media-content-editor-assets
          fetch-depth: 0

      - name: Remove invalid ESLint rule directive
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/admin-web/src/features/content/content-asset-picker.tsx')
          source = path.read_text(encoding='utf-8')
          directive = '/* eslint-disable @next/next/no-img-element -- Runtime Public Variant URLs are not known at build time. */\n\n'
          if directive not in source:
              raise SystemExit('Expected ESLint directive was not found.')
          path.write_text(source.replace(directive, '', 1), encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-pr28-lint-once.yml

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin-web/src/features/content/content-asset-picker.tsx .github/workflows/fix-pr28-lint-once.yml
          git commit -m 'fix: remove unavailable Next.js ESLint rule directive'
          git push origin HEAD:feat/media-content-editor-assets
