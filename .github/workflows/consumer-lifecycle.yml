name: Consumer Retry Lifecycle Gate

on:
  workflow_dispatch:
  push:
    branches: [develop, feat/outbox-webhook-scheduling]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: atlas-consumer-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer-retry-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      ATLAS_ALLOW_CONSUMER_LIFECYCLE_TESTS: '1'
      ATLAS_CONSUMER_LIFECYCLE_DATABASE_URL: postgresql://atlas:atlas-consumer-test@127.0.0.1:5432/atlas_consumer_lifecycle_test
      ATLAS_CONSUMER_LIFECYCLE_REDIS_URL: redis://127.0.0.1:6379/15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atlas_consumer_lifecycle_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-consumer-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_consumer_lifecycle_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable repository pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build actual packages, Worker and API
        run: pnpm build:packages && pnpm --filter @atlas/worker build && pnpm --filter @atlas/api build
      - name: Verify server unit regressions
        run: pnpm --filter @atlas/server test
      - name: Verify PostgreSQL retries, replay and actual BullMQ recovery
        run: node scripts/ci/consumer-lifecycle-e2e.mjs
      - name: Verify compiled Controller guard and DTO contracts
        run: node scripts/ci/consumer-api-contract.mjs
      - name: Report formatting without rewriting source
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/consumer-lifecycle"
          patch="$RUNNER_TEMP/consumer-lifecycle/format.patch"
          : > "$patch"
          status=0
          for file in \
            .github/workflows/consumer-lifecycle.yml \
            docs/implementation/r05b-consumer-lifecycle.md \
            apps/api/src/eventing/consumer.controller.ts \
            apps/api/src/eventing/eventing.module.ts \
            apps/worker/src/eventing/bullmq-eventing.queue.ts \
            packages/database/src/migrations/1788672000000-AddConsumerRetryLifecycle.ts \
            packages/server/src/consumer-lifecycle.test.ts \
            packages/server/src/modules/eventing/ports/consumer-lifecycle.ts \
            packages/server/src/modules/eventing/ports/eventing.repository.ts \
            packages/server/src/modules/eventing/ports/eventing-queue.port.ts \
            packages/server/src/modules/eventing/application/outbox-relay.service.ts \
            packages/server/src/modules/eventing/application/outbox.service.ts \
            packages/server/src/modules/eventing/infrastructure/persistence/consumer-lifecycle.persistence.ts \
            packages/server/src/modules/eventing/infrastructure/persistence/typeorm-eventing.repository.ts \
            packages/server/src/modules/eventing/infrastructure/persistence/eventing.entities.ts \
            scripts/ci/consumer-lifecycle-e2e.mjs \
            scripts/ci/consumer-api-contract.mjs \
            scripts/ci/publication-schedule-effect-e2e.mjs \
            scripts/ci/eventing-attempt-e2e.mjs; do
            if pnpm exec prettier "$file" > "$RUNNER_TEMP/consumer-lifecycle/formatted"; then
              diff -u --label "a/$file" --label "b/$file" "$file" "$RUNNER_TEMP/consumer-lifecycle/formatted" >> "$patch" || status=1
            else
              status=1
            fi
          done
          cat "$patch"
          exit "$status"
      - name: Retain formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-lifecycle-format-${{ github.run_id }}
          path: ${{ runner.temp }}/consumer-lifecycle/format.patch
          if-no-files-found: ignore
          retention-days: 7
