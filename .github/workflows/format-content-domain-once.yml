name: Format recovered content domain once

on:
  push:
    branches:
      - fix/content-foundation-recovery
    paths:
      - .github/workflows/format-content-domain-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/content-foundation-recovery
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format domain file and remove workflow
        run: |
          pnpm prettier --write packages/server/src/modules/content/domain/content.ts
          rm -f .github/workflows/format-content-domain-once.yml

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply Prettier to content domain'
          git push origin HEAD:fix/content-foundation-recovery
