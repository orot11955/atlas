name: Publication Schedule Attempt Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, feat/outbox-webhook-scheduling]

permissions:
  contents: read

concurrency:
  group: atlas-schedule-attempt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-schedule-attempt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      ATLAS_ALLOW_ATTEMPT_TESTS: '1'
      ATLAS_ATTEMPT_TEST_DATABASE_URL: postgresql://atlas:atlas-attempt-test@127.0.0.1:5432/atlas_schedule_attempt_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atlas_schedule_attempt_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-attempt-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_schedule_attempt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable repository pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build actual server and database packages
        run: pnpm build:packages
      - name: Verify server unit regressions
        run: pnpm --filter @atlas/server test
      - name: Verify independent PostgreSQL workers and transactional Audit
        run: node scripts/ci/publication-schedule-attempt-e2e.mjs
      - name: Show formatting differences without rewriting source
        if: always()
        run: |
          set -uo pipefail
          status=0
          for file in \
            packages/server/src/modules/eventing/ports/eventing.repository.ts \
            packages/server/src/modules/eventing/infrastructure/persistence/typeorm-eventing.repository.ts \
            packages/server/src/modules/eventing/application/publication-scheduling.service.ts \
            packages/server/src/publication-schedule-ownership.test.ts \
            scripts/ci/publication-schedule-attempt-e2e.mjs \
            docs/implementation/r04-schedule-attempt-ownership.md \
            .github/workflows/publication-schedule-attempt.yml; do
            pnpm exec prettier "$file" | diff -u "$file" - || status=1
          done
          exit "$status"
