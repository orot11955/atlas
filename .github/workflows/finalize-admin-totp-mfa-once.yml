name: Finalize admin TOTP MFA once

on:
  push:
    branches:
      - feat/admin-totp-mfa

permissions:
  contents: write

concurrency:
  group: prepare-admin-totp-mfa-once
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/admin-totp-mfa

      - name: Apply staged implementation
        run: |
          if [ -f .atlas-prepare/apply.py ]; then
            python3 .atlas-prepare/apply.py
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format implementation
        run: pnpm format

      - name: Commit clean implementation
        run: |
          rm -rf .atlas-prepare
          rm -f .github/workflows/prepare-admin-totp-mfa-once.yml
          rm -f .github/workflows/finalize-admin-totp-mfa-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
          else
            git commit -m 'feat: add admin TOTP MFA and authentication grants'
            git push origin HEAD:feat/admin-totp-mfa
          fi

      - name: Verify clean workspace
        run: |
          pnpm format:check
          pnpm check
          docker compose config > /dev/null
