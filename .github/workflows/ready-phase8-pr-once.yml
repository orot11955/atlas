name: Mark Phase 8 PR ready once

on:
  push:
    branches:
      - tmp/phase8-source-export
    paths:
      - .github/workflows/ready-phase8-pr-once.yml

permissions:
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark PR 22 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 22 --repo "$GITHUB_REPOSITORY"
