name: Eventing Rollout Preflight Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, feat/outbox-webhook-scheduling]

permissions:
  contents: read

concurrency:
  group: atlas-rollout-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: test
      ATLAS_ALLOW_EVENTING_PREFLIGHT_TESTS: '1'
      DATABASE_URL: postgresql://atlas:atlas-preflight-test@127.0.0.1:5432/atlas_eventing_preflight_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atlas_eventing_preflight_test
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-preflight-test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_eventing_preflight_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable repository pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify preflight argument, transaction and redaction regressions
        run: node --test scripts/operations/eventing-rollout-preflight.test.mjs
      - name: Build actual migrations and repositories
        run: pnpm build:packages
      - name: Inspect real pre-policy and post-policy schemas without modifying them
        run: node scripts/ci/eventing-preflight-e2e.mjs
      - name: Report formatting without rewriting source
        if: always()
        run: |
          set -uo pipefail
          mkdir -p tmp/r05g-preflight
          patch=tmp/r05g-preflight/format.patch
          : > "$patch"
          status=0
          for file in \
            scripts/operations/eventing-rollout-preflight.mjs \
            scripts/operations/eventing-rollout-preflight.test.mjs \
            scripts/ci/eventing-preflight-e2e.mjs \
            .github/workflows/eventing-rollout-preflight.yml \
            docs/operations/eventing-rollout-runbook.md; do
            if pnpm exec prettier "$file" > "$RUNNER_TEMP/preflight-formatted"; then
              diff -u --label "a/$file" --label "b/$file" "$file" "$RUNNER_TEMP/preflight-formatted" >> "$patch" || status=1
            else
              status=1
            fi
          done
          cat "$patch"
          exit "$status"
      - name: Retain formatting diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventing-preflight-${{ github.run_id }}
          path: tmp/r05g-preflight/
          if-no-files-found: error
          retention-days: 7
