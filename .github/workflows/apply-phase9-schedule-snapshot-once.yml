name: Apply Phase 9 Schedule Snapshot Once

on:
  push:
    branches:
      - feat/outbox-webhook-scheduling
    paths:
      - .github/workflows/apply-phase9-schedule-snapshot-once.yml

permissions:
  contents: write

concurrency:
  group: phase9-schedule-snapshot-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/outbox-webhook-scheduling
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply immutable schedule target patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase9-schedule-snapshot-once.py
          pnpm exec prettier --write .
          git diff --check

      - name: Run complete quality gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Remove one-time transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/phase9-schedule-snapshot-once.py
          rm -f .github/workflows/apply-phase9-schedule-snapshot-once.yml
          test ! -e scripts/phase9-schedule-snapshot-once.py
          test ! -e .github/workflows/apply-phase9-schedule-snapshot-once.yml

      - name: Commit reviewed product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No reviewed product changes were produced.' >&2
            exit 1
          fi
          git commit -m 'fix: pin Publication Schedule targets transactionally'
          git push origin HEAD:feat/outbox-webhook-scheduling
