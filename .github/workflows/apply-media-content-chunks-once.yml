name: Apply Media Content Chunks Once

on:
  push:
    branches:
      - feat/media-content-integration

permissions:
  contents: write

concurrency:
  group: atlas-apply-media-content-chunks-once
  cancel-in-progress: false

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/media-content-integration
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reassemble and apply Media Content patch
        env:
          PATCH_SHA256: 9a05eff512375a16847e20e64bb80fca9978dc2a3649bf5f30998b5cb88bf864
        run: |
          cat .github/patches/media-content-foundation/part-*.b64 |
            tr -d '\n\r ' |
            base64 --decode > /tmp/atlas-media-content-foundation.patch.gz
          echo "$PATCH_SHA256  /tmp/atlas-media-content-foundation.patch.gz" | sha256sum --check --strict
          gzip -dc /tmp/atlas-media-content-foundation.patch.gz > /tmp/atlas-media-content-foundation.patch
          git apply --check /tmp/atlas-media-content-foundation.patch
          git apply /tmp/atlas-media-content-foundation.patch
          git restore --source=HEAD -- .github/workflows/media-data-gate.yml
          rm -rf .github/patches/media-content-foundation
          rm -f .github/workflows/apply-media-content-chunks-once.yml

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/api/src/content/content.module.ts \
            apps/api/src/content/content.tokens.ts \
            packages/database/src/data-source.ts \
            packages/server/src/modules/content/application/content.service.ts \
            packages/server/src/modules/content/index.ts \
            scripts/ci/admin-auth-e2e.mjs \
            scripts/ci/asset-upload-e2e.mjs \
            scripts/ci/content-publication-delivery-e2e.mjs \
            docs/implementation/phase-8-3-media-content-integration.md \
            packages/database/src/migrations/1788120000000-CreateAssetUsage.ts \
            packages/server/src/content-asset.test.ts \
            packages/server/src/modules/content/domain/content-asset.ts \
            packages/server/src/modules/content/infrastructure/persistence/content-asset.entities.ts \
            packages/server/src/modules/content/infrastructure/persistence/typeorm-content-asset.repository.ts \
            packages/server/src/modules/content/ports/content-asset.repository.ts

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add Content Asset usage foundation'
          git push origin HEAD:feat/media-content-integration
