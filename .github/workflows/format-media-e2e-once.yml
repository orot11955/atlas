name: Format Media E2E once

on:
  push:
    branches:
      - feat/minio-media
    paths:
      - .github/workflows/format-media-e2e-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/minio-media

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Media wiring
        run: |
          pnpm exec prettier --write \
            scripts/ci/admin-auth-e2e.mjs \
            apps/api/src/app.module.ts \
            .github/workflows/media-data-gate.yml

      - name: Commit formatted product files
        run: |
          rm -f .github/workflows/format-media-e2e-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format Media E2E wiring'
          git push origin HEAD:feat/minio-media
