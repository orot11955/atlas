name: Format admin web fix once

on:
  push:
    branches:
      - feat/admin-web-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/admin-web-foundation

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: pnpm exec prettier --write apps/admin-web/src/lib/api/api-client.ts apps/admin-web/src/api-foundation.test.ts

      - name: Commit formatting
        run: |
          rm .github/workflows/format-admin-web-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format admin web foundation'
          git push origin HEAD:feat/admin-web-foundation
