name: Repair Phase 9 Payload 09 Once

on:
  push:
    branches:
      - feat/outbox-webhook-scheduling
    paths:
      - .github/workflows/repair-phase9-payload-09-once.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: atlas-repair-phase9-payload-09-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: '31'
      FEATURE_BRANCH: feat/outbox-webhook-scheduling

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/outbox-webhook-scheduling
          fetch-depth: 0

      - name: Reconstruct and publish valid payload 09
        shell: bash
        run: |
          set -euo pipefail
          expected_hashes=(
            df8c0f672452a091ca999e886e830ad46e0d720b553d1011407039da8432fcac
            b4628d76b77f93f98e38225a3d04ae5092e5c280ef604a42368bcf932c19cb39
            118c445077b288eca6a0048e7f3cb2292b630fa84c060fc96197d29d582216fa
            5872b603127161d1c14f73dca9c347bb5265c9ea8167bae3fa98387bbeed0746
            8659071f3fda4f379cc967eebc54eebff61a7844dcc6ea01f4be01683d5be375
            51734d7c7138ae1a01833c9710c18ee49b733233d0ce156934bd0d30bbd66c22
            d8a95e7093205f465cf82b88f9227f71a702afdcae5e38f31aeab4ea1cf1656d
            7e688b23bcf63dbd9933cb94179e8e20ca45bb9f857e3869bb807bf761793c06
          )

          gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" > /tmp/comments.json
          : > /tmp/payload-09

          for index in $(seq 0 7); do
            marker=$(printf '%02d' "$index")
            expected_hash=${expected_hashes[$index]}
            id=$(
              python3 - /tmp/comments.json "$marker" <<'PY'
          import json
          import sys

          prefix = f'PHASE9_PAYLOAD_09_{sys.argv[2]}\n'
          for comment in json.load(open(sys.argv[1], encoding='utf-8')):
              if comment.get('body', '').startswith(prefix):
                  print(comment['id'])
                  break
          PY
            )
            test -n "$id"
            gh api "repos/$REPOSITORY/issues/comments/$id" > "/tmp/comment-$id.json"
            python3 - "/tmp/comment-$id.json" "$marker" "/tmp/chunk-$marker" <<'PY'
          import json
          import pathlib
          import sys

          body = json.load(open(sys.argv[1], encoding='utf-8'))['body']
          prefix = f'PHASE9_PAYLOAD_09_{sys.argv[2]}\n'
          if not body.startswith(prefix):
              raise SystemExit('Unexpected payload marker')
          pathlib.Path(sys.argv[3]).write_text(body[len(prefix):], encoding='utf-8')
          PY
            test "$(wc -c < "/tmp/chunk-$marker" | tr -d ' ')" = '800'
            echo "$expected_hash  /tmp/chunk-$marker" | sha256sum --check --strict
            cat "/tmp/chunk-$marker" >> /tmp/payload-09
          done

          test "$(wc -c < /tmp/payload-09 | tr -d ' ')" = '6400'
          echo '864ace4e2d735c1f926f543a2be20b35d52d94222ae5bc2249b011029cb692af  /tmp/payload-09' | sha256sum --check --strict

          python3 - /tmp/payload-09 /tmp/body.json <<'PY'
          import json
          import pathlib
          import sys

          payload = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          pathlib.Path(sys.argv[2]).write_text(
              json.dumps({'body': 'PHASE9_PAYLOAD_09\n' + payload}),
              encoding='utf-8',
          )
          PY
          gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input /tmp/body.json

      - name: Remove one-time repair workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-phase9-payload-09-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/repair-phase9-payload-09-once.yml
          git commit -m 'chore: remove Phase 9 payload repair workflow'
          git push origin HEAD:"$FEATURE_BRANCH"
