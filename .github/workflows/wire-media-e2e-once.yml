name: Wire Asset upload E2E once

on:
  push:
    branches:
      - feat/minio-media
    paths:
      - .github/workflows/wire-media-e2e-once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/minio-media

      - name: Wire conditional Asset upload scenario
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/ci/admin-auth-e2e.mjs')
          content = path.read_text(encoding='utf-8')

          import_line = "import { verifyAssetUploadFoundation } from './asset-upload-e2e.mjs';\n"
          import_anchor = "import { verifyApiClientLifecycle } from './api-client-lifecycle-e2e.mjs';\n"
          if import_line not in content:
              if import_anchor not in content:
                  raise RuntimeError('API Client E2E import anchor was not found.')
              content = content.replace(import_anchor, import_line + import_anchor, 1)

          scenario = """
          if (process.env.ATLAS_VERIFY_MEDIA_UPLOAD === '1') {
            await verifyAssetUploadFoundation({ request, session, assertEqual });
          }

          """.replace('          ', '')
          scenario_anchor = "await request('/admin/v1/workspace', { expectedStatus: 401 });\n\n"
          if scenario not in content:
              if scenario_anchor not in content:
                  raise RuntimeError('Authenticated Workspace E2E anchor was not found.')
              content = content.replace(scenario_anchor, scenario_anchor + scenario, 1)

          path.write_text(content, encoding='utf-8')
          PY

      - name: Commit product wiring
        run: |
          rm -f .github/workflows/wire-media-e2e-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: wire authenticated Asset upload E2E'
          git push origin HEAD:feat/minio-media
