name: Export Phase 9 Source Once

on:
  push:
    branches:
      - feat/outbox-webhook-scheduling

permissions:
  contents: write

concurrency:
  group: atlas-export-phase9-source-once
  cancel-in-progress: false

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/outbox-webhook-scheduling
          fetch-depth: 0

      - name: Create source archive
        run: git archive --format=tar.gz --output=atlas-phase9-source.tar.gz HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v6
        with:
          name: atlas-phase9-source
          path: atlas-phase9-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Remove one-time workflow
        run: rm -f .github/workflows/export-phase9-source-once.yml

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/export-phase9-source-once.yml
          git commit -m 'chore: remove Phase 9 source export workflow'
          git push origin HEAD:feat/outbox-webhook-scheduling
