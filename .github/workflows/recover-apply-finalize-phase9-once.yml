name: Recover Apply Finalize Phase 9 Once

on:
  push:
    branches:
      - feat/outbox-webhook-scheduling
    paths:
      - .github/workflows/recover-apply-finalize-phase9-once.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: phase9-recover-apply-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      FEATURE_BRANCH: feat/outbox-webhook-scheduling
      PR_NUMBER: '31'
      ARCHIVE_SHA256: 3c8f50fb355a4f86a63194404dd8383e63fff3237a6a56649e156c6b6407f61a
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/outbox-webhook-scheduling
          fetch-depth: 0

      - name: Reconstruct and verify Phase 9 source archive
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(gh api "repos/$REPOSITORY/branches/$FEATURE_BRANCH" --jq '.commit.sha')"
          test "$remote_sha" = "$GITHUB_SHA"

          gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --slurp > /tmp/phase9-comment-pages.json

          python3 <<'PY'
          import base64
          import hashlib
          import itertools
          import json
          import pathlib
          import re
          import tarfile

          expected_hashes = [
              '5abf32fbd4c09cc245747b0cca48b58f06cb4508f463250bba8c3e551875182c',
              'c6d998a0083792ab112b113789e0c645dd3f1e7cb694d87c66f3f7e75516087e',
              '75021b65df2f89e821e2aabf44f08654a385181b828d6ed913fd1f2d99a2d40a',
              '1b0955ba130c23360d56cd99ff94ea0e7db54d38f6baa0b6b79a93b7698835da',
              'e68a643f439cff5ae4b43a234b9b4158a7f5c275a91d43613ed28c2dfe12a35b',
              '77db5ed95994489b4ed12c0245d13879e40b9a3f4c6101a1034c442490b5dd69',
              '00153c00eac834e2f6fd3cccb145d75f216dbdaf3308d419a04cc4f55554ed35',
              '042c3e3a993e0ec5e83bbb5dccd09a973346cb9cb71603bdb095b3c16af2d05d',
              'c893b60a558bcd7d5bb54da3fc8a3bab80154ddb971efbf6a5109e61137ad8e0',
              '864ace4e2d735c1f926f543a2be20b35d52d94222ae5bc2249b011029cb692af',
              'b21d997084335ff3a1139b8f155e996cdc9c76a13ab9d3eb218def8557af0bda',
              '188319e3a24547b796d3c5db58e8119b863bde17e436af7b7bc2f05bc4768310',
              'fd60140092effd5ebe988368a567d635f4d617cf8bc8f2cbc544d0c7e1246d1e',
              'a7e8670ea0b6b3eb575806b99da88834c6b15c7e7a8528683f05059a096ef7ec',
          ]
          expected_sizes = [13000, 13000, 6400, 6400, 6400, 6400, 6400, 6400, 6400, 6400, 6400, 6400, 6400, 6324]

          raw = json.loads(pathlib.Path('/tmp/phase9-comment-pages.json').read_text(encoding='utf-8'))
          comments = [item for page in raw for item in page] if raw and isinstance(raw[0], list) else raw

          parsed = []
          payload_comment_ids = []
          for comment in comments:
              body = str(comment.get('body', '')).replace('\r\n', '\n')
              marker, separator, rest = body.partition('\n')
              marker = marker.strip()
              if not marker.startswith('PHASE9_PAYLOAD_'):
                  continue
              payload_comment_ids.append(str(comment['id']))
              payload = ''.join(rest.split()) if separator else ''
              if payload and re.fullmatch(r'[A-Za-z0-9+/=]+', payload):
                  parsed.append({
                      'id': int(comment['id']),
                      'marker': marker,
                      'payload': payload,
                      'created_at': str(comment.get('created_at', '')),
                  })

          def digest(value: str) -> str:
              return hashlib.sha256(value.encode('ascii')).hexdigest()

          def exact_chunk(index: int) -> str | None:
              marker = f'PHASE9_PAYLOAD_{index:02d}'
              for item in sorted(parsed, key=lambda entry: entry['id'], reverse=True):
                  value = item['payload']
                  if item['marker'] == marker and len(value) == expected_sizes[index] and digest(value) == expected_hashes[index]:
                      return value
              return None

          def recover_chunk_nine() -> str:
              prefix = 'PHASE9_PAYLOAD_09'
              candidates = [item for item in parsed if item['marker'].startswith(prefix)]

              def valid(value: str) -> bool:
                  return len(value) == expected_sizes[9] and digest(value) == expected_hashes[9]

              for item in candidates:
                  if valid(item['payload']):
                      return item['payload']

              def part_number(marker: str) -> int | None:
                  suffix = marker[len(prefix):]
                  numbers = re.findall(r'\d+', suffix)
                  return int(numbers[-1]) if numbers else None

              grouped: dict[int, list[dict]] = {}
              for item in candidates:
                  number = part_number(item['marker'])
                  if number is not None:
                      grouped.setdefault(number, []).append(item)

              if grouped:
                  keys = sorted(grouped)
                  if keys == list(range(keys[0], keys[-1] + 1)) and len(keys) <= 12:
                      choices = [sorted(grouped[key], key=lambda entry: entry['id'], reverse=True)[:4] for key in keys]
                      for combination in itertools.product(*choices):
                          value = ''.join(item['payload'] for item in combination)
                          if valid(value):
                              return value

              ordered = sorted(candidates, key=lambda entry: entry['id'])
              for count in range(2, min(12, len(ordered)) + 1):
                  for combination in itertools.combinations(ordered, count):
                      if sum(len(item['payload']) for item in combination) != expected_sizes[9]:
                          continue
                      value = ''.join(item['payload'] for item in combination)
                      if valid(value):
                          return value

              compact = [item for item in ordered if len(item['payload']) < expected_sizes[9]]
              if len(compact) <= 9 and sum(len(item['payload']) for item in compact) == expected_sizes[9]:
                  for permutation in itertools.permutations(compact):
                      value = ''.join(item['payload'] for item in permutation)
                      if valid(value):
                          return value

              raise SystemExit('Unable to reconstruct verified PHASE9_PAYLOAD_09')

          chunks = []
          for index in range(14):
              value = exact_chunk(index)
              if value is None and index == 9:
                  value = recover_chunk_nine()
              if value is None:
                  raise SystemExit(f'Missing verified payload chunk {index:02d}')
              chunks.append(value)

          encoded = ''.join(chunks)
          if len(encoded) != 102724:
              raise SystemExit(f'Unexpected encoded archive size: {len(encoded)}')

          archive = base64.b64decode(encoded, validate=True)
          archive_hash = hashlib.sha256(archive).hexdigest()
          expected_archive_hash = '3c8f50fb355a4f86a63194404dd8383e63fff3237a6a56649e156c6b6407f61a'
          if archive_hash != expected_archive_hash:
              raise SystemExit(f'Archive hash mismatch: {archive_hash}')

          archive_path = pathlib.Path('/tmp/phase9-source.tar.bz2')
          archive_path.write_bytes(archive)
          extraction_root = pathlib.Path('/tmp/phase9-extracted')
          extraction_root.mkdir(parents=True, exist_ok=True)

          with tarfile.open(archive_path, mode='r:bz2') as bundle:
              members = bundle.getmembers()
              if len(members) != 60:
                  raise SystemExit(f'Unexpected archive member count: {len(members)}')
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              bundle.extractall(extraction_root, filter='data')

          pathlib.Path('/tmp/phase9-payload-comment-ids.txt').write_text(
              '\n'.join(sorted(set(payload_comment_ids), key=int)) + '\n',
              encoding='utf-8',
          )
          print(f'verified_archive_sha256={archive_hash}')
          print(f'payload_comment_count={len(set(payload_comment_ids))}')
          PY

      - name: Apply verified product source and remove transport artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/phase9-extracted/. .

          rm -f \
            .github/workflows/apply-phase9-source-once.yml \
            .github/workflows/repair-phase9-payload-09-once.yml \
            .github/workflows/recover-apply-finalize-phase9-once.yml
          find .github/workflows -maxdepth 1 -type f \( -name '*phase9*once.yml' -o -name '*phase-9*once.yml' \) -delete
          find scripts -type f \( -name 'apply-phase9*' -o -name 'repair-phase9*' -o -name 'finalize-phase9*' \) -delete 2>/dev/null || true
          rm -rf tmp

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Verified archive produced no product changes.' >&2
            exit 1
          fi
          git commit -m 'feat: implement Transactional Outbox, Webhook and Publication Scheduling'
          git push origin HEAD:"$FEATURE_BRANCH"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install and normalize formatting
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'style: normalize Phase 9 source formatting'
            git push origin HEAD:"$FEATURE_BRANCH"
          fi

      - name: Delete transport payload comments
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/phase9-payload-comment-ids.txt ]]; then
            while IFS= read -r id; do
              [[ -z "$id" ]] && continue
              gh api -X DELETE "repos/$REPOSITORY/issues/comments/$id" >/dev/null 2>&1 || true
            done < /tmp/phase9-payload-comment-ids.txt
          fi

      - name: Run complete local quality gate
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/eventing-data-gate.yml
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Require exact-head GitHub workflow success
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "repos/$REPOSITORY/branches/$FEATURE_BRANCH" --jq '.commit.sha')"
          test "$head_sha" = "$remote_sha"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

          for workflow in ci.yml resource-member-data-gate.yml media-data-gate.yml; do
            gh workflow run "$workflow" --repo "$REPOSITORY" --ref "$FEATURE_BRANCH" >/dev/null 2>&1 || true
          done

          wait_for_path() {
            workflow_path="$1"
            run_id=''
            for _ in $(seq 1 180); do
              run_id="$(gh api -X GET "repos/$REPOSITORY/actions/runs" -f branch="$FEATURE_BRANCH" -f per_page=100 \
                --jq ".workflow_runs[] | select(.head_sha == \"$head_sha\" and .path == \".github/workflows/$workflow_path\") | .id" | head -n 1)"
              [[ -n "$run_id" ]] && break
              sleep 5
            done
            test -n "$run_id"

            for _ in $(seq 1 540); do
              status="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.status')"
              if [[ "$status" == 'completed' ]]; then
                conclusion="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.conclusion')"
                echo "$workflow_path: $conclusion"
                test "$conclusion" = 'success'
                return
              fi
              sleep 5
            done
            echo "Timed out waiting for $workflow_path" >&2
            return 1
          }

          wait_for_path ci.yml
          wait_for_path resource-member-data-gate.yml
          wait_for_path media-data-gate.yml
          wait_for_path eventing-data-gate.yml

      - name: Update PR, mark ready and squash merge
        shell: bash
        run: |
          set -euo pipefail
          head_sha='${{ steps.gates.outputs.head_sha }}'
          current_head="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq '.headRefOid')"
          test "$current_head" = "$head_sha"

          cat > /tmp/phase9-pr-body.md <<'EOF'
          ## Summary

          Phase 9 Outbox, Webhook & Scheduling을 구현합니다.

          - Domain 변경과 같은 Transaction에 저장되는 Transactional Outbox
          - Consumer Receipt 기반 멱등 소비와 stale processing 회수
          - Webhook Endpoint, AES-256-GCM Secret 보관과 Rotation
          - HMAC-SHA-256 서명, Retry/Backoff, Dead Letter, Manual Resend
          - HTTPS 기본 강제, Private Network 차단, DNS Resolve와 IP Pinning
          - Publication Publish/Withdraw Scheduling과 Worker 실행
          - Admin Eventing API, `/admin/webhooks`, Content Publication Scheduler UI
          - rollback 가능한 Migration과 영구 Eventing Data Gate

          ## Verification

          - Format, Lint, Typecheck, Unit Test, Build
          - Migration Up, Down, Reapply
          - Resource Member Data Gate
          - Media Data Gate
          - Eventing Data Gate

          모든 Gate는 이 PR의 최종 Head SHA에서 성공한 결과만 사용했습니다.
          EOF

          gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/phase9-pr-body.md
          if [[ "$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json isDraft --jq '.isDraft')" == 'true' ]]; then
            gh pr ready "$PR_NUMBER" --repo "$REPOSITORY"
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --delete-branch \
            --match-head-commit "$head_sha" \
            --subject 'feat: add Transactional Outbox, Webhook and Publication Scheduling' \
            --body 'Complete Phase 9 with transactional event delivery, secure webhooks, publication scheduling and exact-head verification.'

      - name: Require exact develop verification and clean tree
        shell: bash
        run: |
          set -euo pipefail
          develop_sha="$(gh api "repos/$REPOSITORY/branches/develop" --jq '.commit.sha')"

          for workflow in ci.yml resource-member-data-gate.yml media-data-gate.yml eventing-data-gate.yml; do
            gh workflow run "$workflow" --repo "$REPOSITORY" --ref develop >/dev/null 2>&1 || true
          done

          wait_for_develop_path() {
            workflow_path="$1"
            run_id=''
            for _ in $(seq 1 180); do
              run_id="$(gh api -X GET "repos/$REPOSITORY/actions/runs" -f branch=develop -f per_page=100 \
                --jq ".workflow_runs[] | select(.head_sha == \"$develop_sha\" and .path == \".github/workflows/$workflow_path\") | .id" | head -n 1)"
              [[ -n "$run_id" ]] && break
              sleep 5
            done
            test -n "$run_id"

            for _ in $(seq 1 540); do
              status="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.status')"
              if [[ "$status" == 'completed' ]]; then
                conclusion="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.conclusion')"
                echo "develop $workflow_path: $conclusion"
                test "$conclusion" = 'success'
                return
              fi
              sleep 5
            done
            return 1
          }

          wait_for_develop_path ci.yml
          wait_for_develop_path resource-member-data-gate.yml
          wait_for_develop_path media-data-gate.yml
          wait_for_develop_path eventing-data-gate.yml

          git fetch origin develop
          bad_files="$(git ls-tree -r --name-only origin/develop | grep -E '(^tmp/|apply-.*-once\.yml$|finalize-.*-once\.yml$|repair-.*-once\.yml$|recover-.*-once\.yml$|scripts/(apply|finalize|repair)-.*\.py$)' || true)"
          if [[ -n "$bad_files" ]]; then
            printf '%s\n' "$bad_files" >&2
            exit 1
          fi
          echo "PHASE9_COMPLETE_DEVELOP_SHA=$develop_sha"
