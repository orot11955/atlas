name: Apply Media Lifecycle Once

on:
  push:
    branches:
      - feat/media-lifecycle-completion

permissions:
  contents: write

concurrency:
  group: atlas-apply-media-lifecycle-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/media-lifecycle-completion
          fetch-depth: 0

      - name: Apply lifecycle patch
        run: |
          cat tmp/media-lifecycle.patch.gz.b64.* | base64 --decode | gzip --decompress > /tmp/media-lifecycle.patch
          git apply --whitespace=nowarn /tmp/media-lifecycle.patch

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format lifecycle changes
        run: pnpm exec prettier --write .

      - name: Remove one-time files
        run: |
          rm -f .github/workflows/apply-media-lifecycle-once.yml
          rm -f tmp/media-lifecycle.patch.gz.b64.*
          rmdir tmp 2>/dev/null || true

      - name: Commit lifecycle completion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: complete Media Content lifecycle'
          git push origin HEAD:feat/media-lifecycle-completion
