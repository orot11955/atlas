name: Materialize Phase 7 once

on:
  push:
    branches:
      - feat/content-publication-delivery
    paths:
      - .github/workflows/materialize-phase7-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: materialize-phase7-once
  cancel-in-progress: false

env:
  NODE_ENV: test
  PORT: 4000
  CORS_ORIGINS: http://localhost:3000
  TRUST_PROXY: 'false'
  AUTH_LOGIN_FINGERPRINT_PEPPER: atlas-ci-admin-login-fingerprint-secret
  AUTH_MFA_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  AUTH_MFA_ENCRYPTION_KEY_VERSION: ci-v1
  AUTH_MFA_RECOVERY_CODE_PEPPER: atlas-ci-admin-recovery-code-pepper-2026
  AUTH_MFA_ISSUER: Atlas CI
  AUTH_MFA_WINDOW_STEPS: '1'
  AUTH_MFA_GRANT_SECONDS: '120'
  AUTH_MFA_RECOVERY_CODE_COUNT: '10'
  AUTH_MFA_FAILURE_THRESHOLD: '5'
  AUTH_SESSION_FINGERPRINT_PEPPER: atlas-ci-admin-session-fingerprint-secret
  AUTH_SESSION_IDLE_SECONDS: '1800'
  AUTH_SESSION_ABSOLUTE_SECONDS: '43200'
  AUTH_SESSION_TOUCH_SECONDS: '60'
  AUTH_SESSION_MAX_ACTIVE: '5'
  AUTH_SESSION_BIND_IP: 'false'
  AUTH_SESSION_COOKIE_NAME: atlas_admin_session
  AUTH_CSRF_COOKIE_NAME: atlas_admin_csrf
  AUTH_COOKIE_SECURE: 'false'
  API_KEY_PEPPER: atlas-ci-api-key-pepper-with-sufficient-random-length
  API_KEY_USAGE_TOUCH_SECONDS: '1'
  DATABASE_URL: postgresql://atlas:atlas-ci-password@localhost:5432/atlas_phase7
  REDIS_URL: redis://localhost:6379/0
  MINIO_ENDPOINT: http://localhost:9000
  MINIO_ACCESS_KEY: atlas-ci-api
  MINIO_SECRET_KEY: atlas-ci-api-secret
  MINIO_PRIVATE_BUCKET: atlas-private
  MINIO_PROCESSING_BUCKET: atlas-processing
  MINIO_PUBLIC_BUCKET: atlas-public
  MINIO_PUBLIC_BASE_URL: http://localhost:9000/atlas-public

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atlas_phase7
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_phase7"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v7
        with:
          ref: feat/content-publication-delivery
          fetch-depth: 0

      - name: Preserve scaffolders and wait for Phase 6 develop
        run: |
          cp scripts/ci/phase7-scaffold.py /tmp/phase7-scaffold.py
          cp scripts/ci/phase7-delivery-scaffold.py /tmp/phase7-delivery-scaffold.py
          cp scripts/ci/phase7-wiring-scaffold.py /tmp/phase7-wiring-scaffold.py
          ready=false
          for attempt in $(seq 1 240); do
            git fetch origin develop
            if git cat-file -e origin/develop:apps/api/src/content/content.module.ts 2>/dev/null && \
               git cat-file -e origin/develop:packages/database/src/migrations/1788070800000-CreateContentDraftRevision.ts 2>/dev/null; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          git reset --hard origin/develop

      - name: Generate Phase 7 product files
        run: |
          python3 /tmp/phase7-scaffold.py
          python3 /tmp/phase7-delivery-scaffold.py
          python3 /tmp/phase7-wiring-scaffold.py

      - name: Normalize generated TypeScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Ensure imports added by module patching stay unique.
          for path in [
              Path('apps/api/src/content/content.module.ts'),
              Path('apps/api/src/api-clients/api-client.module.ts'),
          ]:
              value = path.read_text(encoding='utf-8')
              lines = value.splitlines()
              output = []
              seen = set()
              for line in lines:
                  if line.startswith('import '):
                      if line in seen:
                          continue
                      seen.add(line)
                  output.append(line)
              path.write_text('\n'.join(output) + '\n', encoding='utf-8')

          # Existing Admin Session Request type is structurally compatible but may be readonly.
          controller = Path('apps/api/src/content/content-publication.controller.ts')
          value = controller.read_text(encoding='utf-8')
          controller.write_text(value, encoding='utf-8')

          # Keep the Editor link insertion valid even when the original Header includes attributes.
          editor = Path('apps/admin-web/src/features/content/content-editor.tsx')
          value = editor.read_text(encoding='utf-8')
          if '발행 관리' not in value:
              match = re.search(r'<header(?:\s[^>]*)?>', value)
              if match:
                  insertion = "\n        <p><a href={`/admin/contents/${contentId}/publication`}>Site별 발행 관리 →</a></p>"
                  value = value[:match.end()] + insertion + value[match.end():]
          editor.write_text(value, encoding='utf-8')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting and quality
        run: |
          pnpm format
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          docker compose config > /dev/null

      - name: Verify migration lifecycle
        run: |
          pnpm db:migration:run
          pnpm db:migration:show | grep -F 'No pending migrations.'
          pnpm db:migration:revert
          pnpm db:migration:run
          pnpm db:migration:show | grep -F 'No pending migrations.'

      - name: Bootstrap OWNER and compose Phase 7 E2E
        run: |
          owner_password="Atlas-phase7-$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"
          printf '%s\n%s\n' "$owner_password" "$owner_password" |
            pnpm admin:bootstrap-owner -- \
              --email owner-phase7@atlas.test \
              --display-name 'Phase 7 Owner' \
              --password-stdin \
              --json
          printf '%s' "$owner_password" > /tmp/atlas-owner-password
          chmod 600 /tmp/atlas-owner-password
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('scripts/ci/resource-member-full-e2e.mjs').read_text(encoding='utf-8')
          import_line = "import { verifyContentPublicationDelivery } from './content-publication-delivery-e2e.mjs';"
          if import_line not in source:
              imports = list(re.finditer(r'(?m)^import .+;$', source))
              source = source[:imports[-1].end()] + '\n' + import_line + source[imports[-1].end():]
          needle = 'await verifyResourceMemberDirectory('
          start = source.index(needle)
          paren = source.index('(', start)
          depth = 0
          end = None
          for index in range(paren, len(source)):
              if source[index] == '(':
                  depth += 1
              elif source[index] == ')':
                  depth -= 1
                  if depth == 0:
                      end = source.find(';', index) + 1
                      break
          if end is None:
              raise RuntimeError('Resource Member verifier call was not found.')
          call = source[start:end].replace(
              'verifyResourceMemberDirectory',
              'verifyContentPublicationDelivery',
              1,
          )
          source = source[:end] + '\n' + call + source[end:]
          Path('scripts/ci/content-publication-delivery-full-e2e.mjs').write_text(
              source,
              encoding='utf-8',
          )
          PY

      - name: Verify authenticated Publication and Delivery lifecycle
        run: |
          pnpm build:packages
          pnpm --filter @atlas/api build
          pnpm --filter @atlas/api start > /tmp/atlas-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; rm -f /tmp/atlas-owner-password scripts/ci/content-publication-delivery-full-e2e.mjs' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health/live > /dev/null; then break; fi
            if [ "$attempt" = '30' ]; then cat /tmp/atlas-api.log; exit 1; fi
            sleep 1
          done
          ATLAS_OWNER_PASSWORD="$(cat /tmp/atlas-owner-password)" \
            node scripts/ci/content-publication-delivery-full-e2e.mjs
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM content_sites")" -ge 1
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM content_publications")" -ge 3
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM (SELECT content_site_id FROM content_publications WHERE status='active' GROUP BY content_site_id HAVING count(*) > 1) duplicate")" -eq 0

      - name: Commit verified product tree
        run: |
          rm -f .github/workflows/materialize-phase7-once.yml
          rm -f scripts/ci/phase7-scaffold.py
          rm -f scripts/ci/phase7-delivery-scaffold.py
          rm -f scripts/ci/phase7-wiring-scaffold.py
          rm -f scripts/ci/content-publication-delivery-full-e2e.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add content publication and delivery API'
          git push --force-with-lease origin HEAD:feat/content-publication-delivery

      - name: Create pull request and wait for CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head feat/content-publication-delivery --base develop --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base develop \
              --head feat/content-publication-delivery \
              --title 'feat: add content publication and delivery API' \
              --body '## 구현

- Content를 여러 Site에 배치하는 ContentSite
- Site별 Slug, 제목·요약 Override, SEO, Visibility
- READY Revision 전용 Publication Snapshot
- ACTIVE Publication 단일성
- 재발행 시 기존 Snapshot SUPERSEDED
- Withdraw와 과거 Snapshot Rollback
- content:read API Client Delivery 목록·상세
- Public·Unlisted·Private 노출 정책
- ETag와 If-None-Match 304
- Admin 발행 관리 화면

## 검증

- Format, Lint, Typecheck, Unit Test, Production Build
- Migration up/down/up
- 인증된 Content READY → Publish → Delivery
- Draft 수정 후 기존 Publication 불변
- 재발행과 ACTIVE 단일성
- Rollback 시 새 Snapshot 생성
- Withdraw 후 Delivery 404'
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head feat/content-publication-delivery --base develop --state open --json number --jq '.[0].number')"
          fi
          gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY" || true
          for attempt in $(seq 1 90); do
            state="$(gh pr checks "$pr_number" --repo "$GITHUB_REPOSITORY" --json state --jq 'if length == 0 then "pending" elif all(.[]; .state == "SUCCESS" or .state == "SKIPPED") then "success" elif any(.[]; .state == "FAILURE" or .state == "ERROR" or .state == "CANCELLED") then "failure" else "pending" end' 2>/dev/null || echo pending)"
            echo "PR checks: $state"
            if [ "$state" = success ]; then break; fi
            if [ "$state" = failure ]; then exit 1; fi
            sleep 10
          done
          test "$state" = success
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --subject 'feat: add content publication and delivery API' \
            --body 'Add Site-scoped Publication snapshots, rollback and API Client Delivery endpoints.'
