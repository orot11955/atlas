name: Format recovered content foundation once

on:
  push:
    branches:
      - fix/content-foundation-recovery
    paths:
      - .github/workflows/format-content-recovery-once.yml

permissions:
  contents: write

concurrency:
  group: format-content-recovery-once
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/content-foundation-recovery
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix Unicode-safe Markdown text normalization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/server/src/modules/content/domain/content.ts')
          value = path.read_text(encoding='utf-8')
          old = ".replace(/[\\[\\]#>*_`~()-]/gu, ' ')"
          new = ".replace(/[#>*_`~()-]/gu, ' ')\n    .replaceAll('[', ' ')\n    .replaceAll(']', ' ')"
          if old not in value:
              raise RuntimeError('Markdown punctuation normalization target was not found.')
          path.write_text(value.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove stale diagnostics and format repository
        run: |
          rm -f docs/implementation/diagnostics/phase-6-merged-verification.md
          pnpm format
          rm -f .github/workflows/format-content-recovery-once.yml

      - name: Commit formatted sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format recovered content foundation'
          git push origin HEAD:fix/content-foundation-recovery
