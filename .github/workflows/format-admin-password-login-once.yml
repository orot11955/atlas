name: Format admin password login once

on:
  push:
    branches:
      - feat/admin-password-login

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/admin-password-login

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed TypeScript files
        run: |
          pnpm exec prettier --write \
            apps/api/src/admin-auth/admin-auth.controller.ts \
            apps/api/src/admin-auth/admin-auth.module.ts \
            apps/api/src/admin-auth/admin-auth.tokens.ts \
            apps/api/src/admin-auth/redis-admin-login-rate-limiter.ts \
            packages/server/src/admin-password-login.test.ts \
            packages/server/src/modules/identity/application/admin-password-login.service.ts \
            packages/server/src/modules/identity/infrastructure/crypto/sha256-admin-login-challenge-token-issuer.ts \
            packages/server/src/modules/identity/infrastructure/persistence/typeorm-admin-authentication.repository.ts \
            packages/server/src/modules/identity/ports/admin-authentication.repository.ts

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/admin-auth \
            packages/server/src/admin-password-login.test.ts \
            packages/server/src/modules/identity
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format admin password login'
          git push origin HEAD:feat/admin-password-login
