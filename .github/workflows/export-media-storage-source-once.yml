name: Export Media Storage Source Once

on:
  push:
    branches:
      - feat/media-storage-hardening

permissions:
  contents: write

concurrency:
  group: atlas-export-media-storage-source-once
  cancel-in-progress: false

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/media-storage-hardening
          fetch-depth: 0

      - name: Create source archive
        run: git archive --format=tar.gz --output=atlas-media-storage-source.tar.gz HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v6
        with:
          name: atlas-media-storage-source
          path: atlas-media-storage-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Remove one-time workflow
        run: rm -f .github/workflows/export-media-storage-source-once.yml

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/export-media-storage-source-once.yml
          git commit -m 'chore: remove Media storage source export workflow'
          git push origin HEAD:feat/media-storage-hardening
