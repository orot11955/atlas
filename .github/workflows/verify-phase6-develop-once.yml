name: Verify merged Phase 6 once

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/verify-phase6-develop-once.yml

permissions:
  contents: write

env:
  NODE_ENV: test
  PORT: 4000
  CORS_ORIGINS: http://localhost:3000
  TRUST_PROXY: 'false'
  AUTH_LOGIN_FINGERPRINT_PEPPER: atlas-ci-admin-login-fingerprint-secret
  AUTH_MFA_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  AUTH_MFA_ENCRYPTION_KEY_VERSION: ci-v1
  AUTH_MFA_RECOVERY_CODE_PEPPER: atlas-ci-admin-recovery-code-pepper-2026
  AUTH_MFA_ISSUER: Atlas CI
  AUTH_MFA_WINDOW_STEPS: '1'
  AUTH_MFA_GRANT_SECONDS: '120'
  AUTH_MFA_RECOVERY_CODE_COUNT: '10'
  AUTH_MFA_FAILURE_THRESHOLD: '5'
  AUTH_SESSION_FINGERPRINT_PEPPER: atlas-ci-admin-session-fingerprint-secret
  AUTH_SESSION_IDLE_SECONDS: '1800'
  AUTH_SESSION_ABSOLUTE_SECONDS: '43200'
  AUTH_SESSION_TOUCH_SECONDS: '60'
  AUTH_SESSION_MAX_ACTIVE: '5'
  AUTH_SESSION_BIND_IP: 'false'
  AUTH_SESSION_COOKIE_NAME: atlas_admin_session
  AUTH_CSRF_COOKIE_NAME: atlas_admin_csrf
  AUTH_COOKIE_SECURE: 'false'
  API_KEY_PEPPER: atlas-ci-api-key-pepper-with-sufficient-random-length
  API_KEY_USAGE_TOUCH_SECONDS: '1'
  DATABASE_URL: postgresql://atlas:atlas-ci-password@localhost:5432/atlas_phase6_merged
  REDIS_URL: redis://localhost:6379/0
  MINIO_ENDPOINT: http://localhost:9000
  MINIO_ACCESS_KEY: atlas-ci-api
  MINIO_SECRET_KEY: atlas-ci-api-secret
  MINIO_PRIVATE_BUCKET: atlas-private
  MINIO_PROCESSING_BUCKET: atlas-processing
  MINIO_PUBLIC_BUCKET: atlas-public
  MINIO_PUBLIC_BASE_URL: http://localhost:9000/atlas-public

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atlas_phase6_merged
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_phase6_merged"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout merged develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting, lint, types, tests and builds
        id: quality
        continue-on-error: true
        run: |
          set -o pipefail
          {
            pnpm format:check
            pnpm lint
            pnpm typecheck
            pnpm test
            pnpm build
          } 2>&1 | tee /tmp/phase6-merged-quality.log

      - name: Verify migration lifecycle
        id: migration
        if: steps.quality.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            pnpm db:migration:run
            pnpm db:migration:show
            pnpm db:migration:revert
            pnpm db:migration:run
            pnpm db:migration:show
          } 2>&1 | tee /tmp/phase6-merged-migration.log

      - name: Bootstrap verification OWNER
        id: bootstrap
        if: steps.quality.outcome == 'success' && steps.migration.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          owner_password="Atlas-phase6-merged-$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"
          printf '%s\n%s\n' "$owner_password" "$owner_password" |
            pnpm admin:bootstrap-owner -- \
              --email owner-phase6-merged@atlas.test \
              --display-name 'Phase 6 Merged Owner' \
              --password-stdin \
              --json 2>&1 | tee /tmp/phase6-merged-bootstrap.log
          printf '%s' "$owner_password" > /tmp/atlas-owner-password
          chmod 600 /tmp/atlas-owner-password

      - name: Build authenticated Content E2E harness
        id: harness
        if: steps.bootstrap.outcome == 'success'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('scripts/ci/resource-member-full-e2e.mjs').read_text(encoding='utf-8')
          import_line = "import { verifyContentDraftRevision } from './content-draft-revision-e2e.mjs';"
          if import_line not in source:
              imports = list(re.finditer(r"(?m)^import .+;$", source))
              if not imports:
                  raise RuntimeError('No import location was found in the full E2E harness.')
              source = source[:imports[-1].end()] + '\n' + import_line + source[imports[-1].end():]

          needle = 'await verifyResourceMemberDirectory('
          start = source.index(needle)
          paren = source.index('(', start)
          depth = 0
          end = None
          for index in range(paren, len(source)):
              if source[index] == '(':
                  depth += 1
              elif source[index] == ')':
                  depth -= 1
                  if depth == 0:
                      end = source.find(';', index) + 1
                      break
          if end is None:
              raise RuntimeError('Resource Member verifier call boundary was not found.')
          content_call = source[start:end].replace(
              'verifyResourceMemberDirectory',
              'verifyContentDraftRevision',
              1,
          )
          source = source[:end] + '\n' + content_call + source[end:]
          Path('scripts/ci/content-draft-revision-merged-e2e.mjs').write_text(
              source,
              encoding='utf-8',
          )
          PY

      - name: Verify authenticated Content lifecycle
        id: e2e
        if: steps.harness.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm build:packages
          pnpm --filter @atlas/api build
          pnpm --filter @atlas/api start > /tmp/atlas-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; rm -f /tmp/atlas-owner-password scripts/ci/content-draft-revision-merged-e2e.mjs' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health/live > /dev/null; then break; fi
            if [ "$attempt" = '30' ]; then cat /tmp/atlas-api.log; exit 1; fi
            sleep 1
          done
          ATLAS_OWNER_PASSWORD="$(cat /tmp/atlas-owner-password)" \
            node scripts/ci/content-draft-revision-merged-e2e.mjs 2>&1 |
            tee /tmp/phase6-merged-e2e.log

      - name: Verify immutable Revision trigger
        id: immutable
        if: steps.e2e.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM content_revisions")" -ge 2
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "UPDATE content_revisions SET note = note WHERE id = (SELECT id FROM content_revisions LIMIT 1)"; then
            echo 'Content Revision UPDATE unexpectedly succeeded.' >&2
            exit 1
          fi

      - name: Record failure diagnostics
        if: >-
          steps.quality.outcome != 'success' ||
          steps.migration.outcome != 'success' ||
          steps.bootstrap.outcome != 'success' ||
          steps.harness.outcome != 'success' ||
          steps.e2e.outcome != 'success' ||
          steps.immutable.outcome != 'success'
        run: |
          mkdir -p docs/implementation/diagnostics
          {
            echo '# Phase 6 merged-tree verification failure'
            echo
            echo "- quality: ${{ steps.quality.outcome }}"
            echo "- migration: ${{ steps.migration.outcome }}"
            echo "- bootstrap: ${{ steps.bootstrap.outcome }}"
            echo "- harness: ${{ steps.harness.outcome }}"
            echo "- e2e: ${{ steps.e2e.outcome }}"
            echo "- immutable: ${{ steps.immutable.outcome }}"
            for log in /tmp/phase6-merged-*.log /tmp/atlas-api.log; do
              [ -f "$log" ] || continue
              echo
              echo "## $(basename "$log")"
              echo '```text'
              tail -n 300 "$log"
              echo '```'
            done
          } > docs/implementation/diagnostics/phase-6-merged-verification.md
          rm -f .github/workflows/verify-phase6-develop-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: capture Phase 6 merged-tree diagnostics'
          git push origin HEAD:develop
          exit 1

      - name: Record successful verification
        if: >-
          steps.quality.outcome == 'success' &&
          steps.migration.outcome == 'success' &&
          steps.bootstrap.outcome == 'success' &&
          steps.harness.outcome == 'success' &&
          steps.e2e.outcome == 'success' &&
          steps.immutable.outcome == 'success'
        run: |
          mkdir -p docs/implementation/verification
          cat > docs/implementation/verification/phase-6-develop.md <<EOF
          # Phase 6 merged-tree verification

          The merged \`develop\` tree was verified by GitHub Actions run \`${GITHUB_RUN_ID}\`.

          Verified boundaries:

          - Prettier formatting
          - ESLint
          - TypeScript typecheck
          - Complete unit test suite
          - NestJS and Next.js production builds
          - Migration up, down and re-apply
          - Authenticated Content Draft autosave
          - Draft optimistic-lock conflict
          - Sanitized server preview
          - Immutable Checkpoint and READY revisions
          - Revision listing and Draft restore
          - Content archive boundary
          - Database trigger rejection of Revision UPDATE
          EOF
          rm -f .github/workflows/verify-phase6-develop-once.yml
          rm -rf docs/implementation/diagnostics
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: record verified Phase 6 merged tree'
          git push origin HEAD:develop
