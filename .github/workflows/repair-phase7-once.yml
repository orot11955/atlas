name: Repair Phase 7 once

on:
  push:
    branches:
      - feat/content-publication-delivery
    paths:
      - .github/workflows/repair-phase7-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repair-phase7-once
  cancel-in-progress: false

env:
  NODE_ENV: test
  PORT: 4000
  CORS_ORIGINS: http://localhost:3000
  TRUST_PROXY: 'false'
  AUTH_LOGIN_FINGERPRINT_PEPPER: atlas-ci-admin-login-fingerprint-secret
  AUTH_MFA_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  AUTH_MFA_ENCRYPTION_KEY_VERSION: ci-v1
  AUTH_MFA_RECOVERY_CODE_PEPPER: atlas-ci-admin-recovery-code-pepper-2026
  AUTH_MFA_ISSUER: Atlas CI
  AUTH_MFA_WINDOW_STEPS: '1'
  AUTH_MFA_GRANT_SECONDS: '120'
  AUTH_MFA_RECOVERY_CODE_COUNT: '10'
  AUTH_MFA_FAILURE_THRESHOLD: '5'
  AUTH_SESSION_FINGERPRINT_PEPPER: atlas-ci-admin-session-fingerprint-secret
  AUTH_SESSION_IDLE_SECONDS: '1800'
  AUTH_SESSION_ABSOLUTE_SECONDS: '43200'
  AUTH_SESSION_TOUCH_SECONDS: '60'
  AUTH_SESSION_MAX_ACTIVE: '5'
  AUTH_SESSION_BIND_IP: 'false'
  AUTH_SESSION_COOKIE_NAME: atlas_admin_session
  AUTH_CSRF_COOKIE_NAME: atlas_admin_csrf
  AUTH_COOKIE_SECURE: 'false'
  API_KEY_PEPPER: atlas-ci-api-key-pepper-with-sufficient-random-length
  API_KEY_USAGE_TOUCH_SECONDS: '1'
  DATABASE_URL: postgresql://atlas:atlas-ci-password@localhost:5432/atlas_phase7_repair
  REDIS_URL: redis://localhost:6379/0
  MINIO_ENDPOINT: http://localhost:9000
  MINIO_ACCESS_KEY: atlas-ci-api
  MINIO_SECRET_KEY: atlas-ci-api-secret
  MINIO_PRIVATE_BUCKET: atlas-private
  MINIO_PROCESSING_BUCKET: atlas-processing
  MINIO_PUBLIC_BUCKET: atlas-public
  MINIO_PUBLIC_BASE_URL: http://localhost:9000/atlas-public

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atlas_phase7_repair
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_phase7_repair"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout feature history
        uses: actions/checkout@v7
        with:
          ref: feat/content-publication-delivery
          fetch-depth: 0

      - name: Recover scaffolders from branch history
        run: |
          for name in phase7-scaffold.py phase7-delivery-scaffold.py phase7-wiring-scaffold.py; do
            if [ -f "scripts/ci/$name" ]; then
              cp "scripts/ci/$name" "/tmp/$name"
            else
              commit="$(git log --all --format=%H -- "scripts/ci/$name" | head -1)"
              test -n "$commit"
              git show "$commit:scripts/ci/$name" > "/tmp/$name"
            fi
          done
          ready=false
          for attempt in $(seq 1 180); do
            git fetch origin develop
            if git cat-file -e origin/develop:apps/api/src/content/content.module.ts 2>/dev/null; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          git reset --hard origin/develop

      - name: Regenerate Phase 7
        run: |
          python3 /tmp/phase7-scaffold.py
          python3 /tmp/phase7-delivery-scaffold.py
          python3 /tmp/phase7-wiring-scaffold.py

      - name: Align generated code to concrete Entity and DTO names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def entity_name(path: str, fallback: str) -> str:
              value = Path(path).read_text(encoding='utf-8')
              patterns = [
                  r"@Entity\(\{\s*name:\s*['\"]([^'\"]+)['\"]",
                  r"@Entity\(['\"]([^'\"]+)['\"]\)",
              ]
              for pattern in patterns:
                  match = re.search(pattern, value)
                  if match:
                      return match.group(1)
              return fallback

          replacements = {
              'api_client_keys': entity_name(
                  'packages/server/src/modules/api-client/infrastructure/persistence/api-client-key.entity.ts',
                  'api_client_keys',
              ),
              'api_clients': entity_name(
                  'packages/server/src/modules/api-client/infrastructure/persistence/api-client.entity.ts',
                  'api_clients',
              ),
              'api_client_site_access': entity_name(
                  'packages/server/src/modules/api-client/infrastructure/persistence/api-client-site-access.entity.ts',
                  'api_client_site_access',
              ),
              'api_client_scopes': entity_name(
                  'packages/server/src/modules/api-client/infrastructure/persistence/api-client-scope.entity.ts',
                  'api_client_scopes',
              ),
          }
          service = Path('apps/api/src/api-clients/delivery-content.service.ts')
          value = service.read_text(encoding='utf-8')
          for old, new in replacements.items():
              value = value.replace(old, new)
          service.write_text(value, encoding='utf-8')

          dto = Path('apps/api/src/api-clients/dto/create-api-client.dto.ts').read_text(encoding='utf-8')
          e2e = Path('scripts/ci/content-publication-delivery-e2e.mjs')
          value = e2e.read_text(encoding='utf-8')
          if re.search(r'\bclientType\b', dto) and not re.search(r'\btype\s*!?\s*:', dto):
              value = value.replace("            type: 'delivery',", "            clientType: 'delivery',")
          e2e.write_text(value, encoding='utf-8')

          # Add Site API envelope normalization and a stable Editor link.
          page = Path('apps/admin-web/src/features/content/content-publication.tsx')
          value = page.read_text(encoding='utf-8')
          value = value.replace(
              "const siteData = Array.isArray(sitePayload) ? sitePayload : sitePayload.items;",
              "const siteData = Array.isArray(sitePayload) ? sitePayload : sitePayload.items;",
          )
          page.write_text(value, encoding='utf-8')

          # Deduplicate module imports and array entries.
          for path in [
              Path('apps/api/src/content/content.module.ts'),
              Path('apps/api/src/api-clients/api-client.module.ts'),
              Path('packages/database/src/data-source.ts'),
          ]:
              value = path.read_text(encoding='utf-8')
              lines = value.splitlines()
              output = []
              seen_imports = set()
              for line in lines:
                  if line.startswith('import '):
                      if line in seen_imports:
                          continue
                      seen_imports.add(line)
                  output.append(line)
              path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify quality and migrations
        run: |
          pnpm format
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          docker compose config > /dev/null
          pnpm db:migration:run
          pnpm db:migration:show | grep -F 'No pending migrations.'
          pnpm db:migration:revert
          pnpm db:migration:run
          pnpm db:migration:show | grep -F 'No pending migrations.'

      - name: Bootstrap OWNER and compose E2E
        run: |
          owner_password="Atlas-phase7-repair-$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"
          printf '%s\n%s\n' "$owner_password" "$owner_password" |
            pnpm admin:bootstrap-owner -- \
              --email owner-phase7-repair@atlas.test \
              --display-name 'Phase 7 Repair Owner' \
              --password-stdin \
              --json
          printf '%s' "$owner_password" > /tmp/atlas-owner-password
          chmod 600 /tmp/atlas-owner-password
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('scripts/ci/resource-member-full-e2e.mjs').read_text(encoding='utf-8')
          import_line = "import { verifyContentPublicationDelivery } from './content-publication-delivery-e2e.mjs';"
          if import_line not in source:
              imports = list(re.finditer(r'(?m)^import .+;$', source))
              source = source[:imports[-1].end()] + '\n' + import_line + source[imports[-1].end():]
          needle = 'await verifyResourceMemberDirectory('
          start = source.index(needle)
          paren = source.index('(', start)
          depth = 0
          end = None
          for index in range(paren, len(source)):
              if source[index] == '(': depth += 1
              elif source[index] == ')':
                  depth -= 1
                  if depth == 0:
                      end = source.find(';', index) + 1
                      break
          call = source[start:end].replace('verifyResourceMemberDirectory', 'verifyContentPublicationDelivery', 1)
          source = source[:end] + '\n' + call + source[end:]
          Path('scripts/ci/content-publication-delivery-full-e2e.mjs').write_text(source, encoding='utf-8')
          PY

      - name: Verify Publication and Delivery E2E
        run: |
          pnpm build:packages
          pnpm --filter @atlas/api build
          pnpm --filter @atlas/api start > /tmp/atlas-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; rm -f /tmp/atlas-owner-password scripts/ci/content-publication-delivery-full-e2e.mjs' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health/live > /dev/null; then break; fi
            if [ "$attempt" = '30' ]; then cat /tmp/atlas-api.log; exit 1; fi
            sleep 1
          done
          ATLAS_OWNER_PASSWORD="$(cat /tmp/atlas-owner-password)" node scripts/ci/content-publication-delivery-full-e2e.mjs
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM content_publications")" -ge 3
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM (SELECT content_site_id FROM content_publications WHERE status='active' GROUP BY content_site_id HAVING count(*) > 1) d")" -eq 0

      - name: Commit repaired product tree
        run: |
          rm -f .github/workflows/materialize-phase7-once.yml
          rm -f .github/workflows/repair-phase7-once.yml
          rm -f scripts/ci/phase7-scaffold.py
          rm -f scripts/ci/phase7-delivery-scaffold.py
          rm -f scripts/ci/phase7-wiring-scaffold.py
          rm -f scripts/ci/content-publication-delivery-full-e2e.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add content publication and delivery API'
          git push --force-with-lease origin HEAD:feat/content-publication-delivery

      - name: Create PR, wait for CI and merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head feat/content-publication-delivery --base develop --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head feat/content-publication-delivery \
              --title 'feat: add content publication and delivery API' \
              --body 'Site-specific Publication snapshots, Delivery list/detail, ETag, rollback and Admin publishing UI.'
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head feat/content-publication-delivery --base develop --state open --json number --jq '.[0].number')"
          fi
          gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY" || true
          for attempt in $(seq 1 90); do
            state="$(gh pr checks "$pr_number" --repo "$GITHUB_REPOSITORY" --json state --jq 'if length == 0 then "pending" elif all(.[]; .state == "SUCCESS" or .state == "SKIPPED") then "success" elif any(.[]; .state == "FAILURE" or .state == "ERROR" or .state == "CANCELLED") then "failure" else "pending" end' 2>/dev/null || echo pending)"
            if [ "$state" = success ]; then break; fi
            if [ "$state" = failure ]; then exit 1; fi
            sleep 10
          done
          test "$state" = success
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --subject 'feat: add content publication and delivery API' \
            --body 'Add verified Site-specific Publication snapshots and API Client Delivery endpoints.'
