name: Format Diff Once

on:
  push:
    branches:
      - feat/media-processing-variants
    paths:
      - .github/workflows/format-diff-once.yml

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write \
            packages/server/src/modules/media/domain/asset-processing.ts \
            packages/server/src/modules/media/infrastructure/persistence/typeorm-asset-processing.repository.ts
          git diff --no-ext-diff --no-color --unified=100 -- \
            packages/server/src/modules/media/domain/asset-processing.ts \
            packages/server/src/modules/media/infrastructure/persistence/typeorm-asset-processing.repository.ts
