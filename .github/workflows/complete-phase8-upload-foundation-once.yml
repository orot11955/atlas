name: Complete Phase 8 upload foundation once

on:
  push:
    branches:
      - feat/minio-media
    paths:
      - .github/workflows/complete-phase8-upload-foundation-once.yml

permissions:
  contents: write

concurrency:
  group: complete-phase8-upload-foundation-once
  cancel-in-progress: true

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/minio-media

      - name: Finalize product source boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          modules = root / 'packages/server/src/modules/index.ts'
          content = modules.read_text(encoding='utf-8')
          export_line = "export * from './media';"
          if export_line not in content:
              modules.write_text(content.rstrip() + '\n' + export_line + '\n', encoding='utf-8')

          service_path = root / 'packages/server/src/modules/media/application/asset.service.ts'
          service = service_path.read_text(encoding='utf-8')
          if 'export type AssetUploadSessionView' not in service:
              service = service.replace(
                  'export interface CreateAssetUploadSessionResult {',
                  "export type AssetUploadSessionView = Omit<\n  AssetUploadSessionRecord,\n  'temporaryObjectKey'\n>;\n\nexport interface CreateAssetUploadSessionResult {",
                  1,
              )
              service = service.replace(
                  '  session: Readonly<AssetUploadSessionRecord>;',
                  '  session: Readonly<AssetUploadSessionView>;',
                  1,
              )
              old_helper = """function freezeUploadSession(
  session: AssetUploadSessionRecord,
): Readonly<AssetUploadSessionRecord> {
  return Object.freeze({
    ...session,
    expiresAt: new Date(session.expiresAt),
    completedAt: session.completedAt ? new Date(session.completedAt) : undefined,
    failedAt: session.failedAt ? new Date(session.failedAt) : undefined,
    createdAt: new Date(session.createdAt),
    updatedAt: new Date(session.updatedAt),
  });
}
"""
              new_helper = """function freezeUploadSession(
  session: AssetUploadSessionRecord,
): Readonly<AssetUploadSessionView> {
  return Object.freeze({
    id: session.id,
    workspaceId: session.workspaceId,
    assetId: session.assetId,
    status: session.status,
    expectedSize: session.expectedSize,
    expectedSha256: session.expectedSha256,
    declaredContentType: session.declaredContentType,
    expiresAt: new Date(session.expiresAt),
    completedAt: session.completedAt ? new Date(session.completedAt) : undefined,
    failedAt: session.failedAt ? new Date(session.failedAt) : undefined,
    failureCode: session.failureCode,
    createdAt: new Date(session.createdAt),
    updatedAt: new Date(session.updatedAt),
  });
}
"""
              if old_helper not in service:
                  raise RuntimeError('Asset upload session helper was not found.')
              service = service.replace(old_helper, new_helper, 1)
              service_path.write_text(service, encoding='utf-8')

          controller_path = root / 'apps/api/src/media/media.controller.ts'
          controller = controller_path.read_text(encoding='utf-8')
          controller = controller.replace(
              '  type AssetUploadSessionRecord,',
              '  type AssetUploadSessionView,',
          )
          controller = controller.replace(
              'Readonly<AssetUploadSessionRecord>',
              'Readonly<AssetUploadSessionView>',
          )
          controller_path.write_text(controller, encoding='utf-8')

          for workflow in (root / '.github/workflows').glob('*phase8*once.yml'):
              if workflow.name != 'complete-phase8-upload-foundation-once.yml':
                  workflow.unlink()

          for path in [
              root / 'scripts/apply-phase8-media.py',
              root / 'scripts/finalize-phase8-media.py',
              root / 'scripts/finalize-phase8-media-v2.py',
              root / 'scripts/repair-phase8-media.py',
          ]:
              path.unlink(missing_ok=True)

          shutil.rmtree(root / '.atlas-phase8', ignore_errors=True)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Format product source
        run: pnpm format

      - name: Verify quality after safe Asset result contract
        run: |
          pnpm format:check
          pnpm check
          docker compose config > /dev/null

      - name: Commit verified product source
        run: |
          rm -f .github/workflows/complete-phase8-upload-foundation-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: finalize private Asset upload foundation'
          git push origin HEAD:feat/minio-media
