name: Verify and merge Site API clients once

on:
  push:
    branches:
      - feat/site-api-clients

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verify-and-merge-site-api-clients-once
  cancel-in-progress: true

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_ENV: test
      PORT: 4000
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY: 'false'
      AUTH_LOGIN_FINGERPRINT_PEPPER: atlas-ci-admin-login-fingerprint-secret
      AUTH_MFA_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      AUTH_MFA_ENCRYPTION_KEY_VERSION: ci-v1
      AUTH_MFA_RECOVERY_CODE_PEPPER: atlas-ci-admin-recovery-code-pepper-2026
      AUTH_MFA_ISSUER: Atlas CI
      AUTH_MFA_WINDOW_STEPS: 1
      AUTH_MFA_GRANT_SECONDS: 120
      AUTH_MFA_RECOVERY_CODE_COUNT: 10
      AUTH_MFA_FAILURE_THRESHOLD: 5
      AUTH_SESSION_FINGERPRINT_PEPPER: atlas-ci-admin-session-fingerprint-secret
      AUTH_SESSION_IDLE_SECONDS: 1800
      AUTH_SESSION_ABSOLUTE_SECONDS: 43200
      AUTH_SESSION_TOUCH_SECONDS: 60
      AUTH_SESSION_MAX_ACTIVE: 5
      AUTH_SESSION_BIND_IP: 'false'
      AUTH_SESSION_COOKIE_NAME: atlas_admin_session
      AUTH_CSRF_COOKIE_NAME: atlas_admin_csrf
      AUTH_COOKIE_SECURE: 'false'
      AUTH_API_KEY_PEPPER: atlas-ci-api-client-key-secret-pepper
      API_CLIENT_USAGE_TOUCH_SECONDS: 1
      API_CLIENT_KEY_GRACE_SECONDS: 60
      DATABASE_URL: postgresql://atlas:atlas-ci-password@localhost:5432/atlas_ci
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: atlas-ci-api
      MINIO_SECRET_KEY: atlas-ci-api-secret
      MINIO_PRIVATE_BUCKET: atlas-private
      MINIO_PROCESSING_BUCKET: atlas-processing
      MINIO_PUBLIC_BUCKET: atlas-public
      MINIO_PUBLIC_BASE_URL: http://localhost:9000/atlas-public

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atlas_ci
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout latest feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/site-api-clients

      - name: Materialize implementation if required
        run: |
          if [ -f .atlas-api-client/apply.py ]; then
            python3 .atlas-api-client/apply.py
          fi
          test -f packages/server/src/modules/api-client/index.ts
          test -f apps/api/src/api-clients/api-client.module.ts
          test -f apps/admin-web/src/features/api-clients/api-client-manager.tsx

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format implementation
        run: pnpm format

      - name: Verify quality
        run: |
          pnpm format:check
          pnpm check
          docker compose config > /dev/null

      - name: Verify migrations
        run: |
          pnpm db:migration:run
          pnpm db:migration:show | grep -F 'No pending migrations.'
          pnpm db:migration:revert
          pnpm db:migration:run
          pnpm db:migration:show | grep -F 'No pending migrations.'

      - name: Verify complete Site API Client lifecycle
        run: |
          owner_password="Atlas-ci-$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"

          printf '%s\n%s\n' "$owner_password" "$owner_password" |
            pnpm admin:bootstrap-owner -- \
              --email owner-ci@atlas.test \
              --display-name 'CI Owner' \
              --password-stdin \
              --json

          printf '%s' "$owner_password" > /tmp/atlas-owner-password
          chmod 600 /tmp/atlas-owner-password

          pnpm build:packages
          pnpm --filter @atlas/api build
          pnpm --filter @atlas/api start > /tmp/atlas-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; rm -f /tmp/atlas-owner-password' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health/live > /dev/null; then
              break
            fi

            if [ "$attempt" = '30' ]; then
              cat /tmp/atlas-api.log
              exit 1
            fi

            sleep 1
          done

          ATLAS_OWNER_PASSWORD="$(cat /tmp/atlas-owner-password)" \
            node scripts/ci/admin-auth-e2e.mjs

      - name: Commit clean implementation
        run: |
          rm -rf .atlas-api-client
          rm -f \
            .github/workflows/verify-site-api-clients-once.yml \
            .github/workflows/format-site-api-clients-once.yml \
            .github/workflows/finalize-site-api-clients-once.yml \
            .github/workflows/verify-and-merge-site-api-clients-once.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add Site API clients and Key lifecycle'
            git push origin HEAD:feat/site-api-clients
          fi

      - name: Merge pull request
        if: ${{ env.ATLAS_API_CLIENT_PR != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATLAS_API_CLIENT_PR: ${{ vars.ATLAS_API_CLIENT_PR }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          response="$(curl -fsS \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${ATLAS_API_CLIENT_PR}/merge" \
            -d "$(node -e 'process.stdout.write(JSON.stringify({sha: process.argv[1], merge_method: \"squash\", commit_title: \"feat: add Site API clients and Key lifecycle\", commit_message: \"Add Site-scoped API Clients, one-time HMAC Key issuance, Scope and Origin enforcement, Redis rate limits, rotation Grace Periods, revocation, Delivery authentication and the administration UI.\"}))' "$head_sha")")"
          node -e '
            const response = JSON.parse(process.argv[1]);
            if (response.merged !== true) {
              throw new Error(`Pull request merge failed: ${JSON.stringify(response)}`);
            }
          ' "$response"
