name: Apply Media Content Foundation Once

on:
  push:
    branches:
      - feat/media-content-integration

permissions:
  contents: write

concurrency:
  group: atlas-apply-media-content-foundation-once
  cancel-in-progress: false

jobs:
  apply-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/media-content-integration
          fetch-depth: 0

      - name: Verify clean base
        run: test "$(git rev-parse HEAD^)" = '069a2ea371204c29b618bce5f38d6077aceec422'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Media Content foundation
