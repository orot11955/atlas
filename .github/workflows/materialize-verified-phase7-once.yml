name: Materialize verified Phase 7 source once

on:
  push:
    branches:
      - feat/content-publication-delivery
    paths:
      - .github/workflows/materialize-verified-phase7-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 7 branch
        uses: actions/checkout@v7
        with:
          ref: feat/content-publication-delivery
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Inspect verified payload parts
        run: |
          wc -c \
            .phase7-payload/part-00-0* \
            .phase7-payload/part-01 \
            .phase7-payload/part-02 \
            .phase7-payload/part-03-0* \
            .phase7-payload/part-04
          sha256sum \
            .phase7-payload/part-00-0* \
            .phase7-payload/part-01 \
            .phase7-payload/part-02 \
            .phase7-payload/part-03-0* \
            .phase7-payload/part-04

      - name: Write verified product source
        run: python scripts/ci/materialize-verified-phase7.py

      - name: Verify materialized tree
        run: |
          git diff --check
          test -f packages/server/src/modules/content/domain/content-publication.ts
          test -f packages/database/src/migrations/1788076200000-CreateContentPublicationDelivery.ts
          test -f apps/api/src/api-clients/delivery-content.controller.ts
          test -f apps/admin-web/src/features/content/content-publication-manager.tsx
          test ! -e .phase7-payload
          test ! -e scripts/ci/phase7-scaffold.py
          test ! -e .github/workflows/materialize-phase7-once.yml

      - name: Commit product source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Materialization produced no changes.' >&2
            exit 1
          fi
          git commit -m 'feat: implement immutable content publication delivery'
          git push origin HEAD:feat/content-publication-delivery
