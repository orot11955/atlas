name: Finalize Asset upload foundation

on:
  push:
    branches:
      - feat/minio-media
    paths:
      - .github/workflows/finalize-asset-upload-foundation.yml

permissions:
  contents: write

concurrency:
  group: finalize-asset-upload-foundation
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/minio-media

      - name: Patch safe upload result and clean temporary files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          service_path = root / 'packages/server/src/modules/media/application/asset.service.ts'
          service = service_path.read_text(encoding='utf-8')

          result_old = """export interface CreateAssetUploadSessionResult {
            asset: Readonly<AssetRecord>;
            session: Readonly<AssetUploadSessionRecord>;
          """.replace('            ', '')
          result_new = """export type AssetUploadSessionView = Omit<
            AssetUploadSessionRecord,
            'temporaryObjectKey'
          >;

          export interface CreateAssetUploadSessionResult {
            asset: Readonly<AssetRecord>;
            session: Readonly<AssetUploadSessionView>;
          """.replace('          ', '')
          if result_old not in service:
              raise RuntimeError('CreateAssetUploadSessionResult contract was not found.')
          service = service.replace(result_old, result_new, 1)

          helper_old = """function freezeUploadSession(
            session: AssetUploadSessionRecord,
          ): Readonly<AssetUploadSessionRecord> {
            return Object.freeze({
              ...session,
              expiresAt: new Date(session.expiresAt),
              completedAt: session.completedAt ? new Date(session.completedAt) : undefined,
              failedAt: session.failedAt ? new Date(session.failedAt) : undefined,
              createdAt: new Date(session.createdAt),
              updatedAt: new Date(session.updatedAt),
            });
          }
          """.replace('          ', '')
          helper_new = """function freezeUploadSession(
            session: AssetUploadSessionRecord,
          ): Readonly<AssetUploadSessionView> {
            return Object.freeze({
              id: session.id,
              workspaceId: session.workspaceId,
              assetId: session.assetId,
              status: session.status,
              expectedSize: session.expectedSize,
              expectedSha256: session.expectedSha256,
              declaredContentType: session.declaredContentType,
              expiresAt: new Date(session.expiresAt),
              completedAt: session.completedAt ? new Date(session.completedAt) : undefined,
              failedAt: session.failedAt ? new Date(session.failedAt) : undefined,
              failureCode: session.failureCode,
              createdAt: new Date(session.createdAt),
              updatedAt: new Date(session.updatedAt),
            });
          }
          """.replace('          ', '')
          if helper_old not in service:
              raise RuntimeError('freezeUploadSession helper was not found.')
          service_path.write_text(service.replace(helper_old, helper_new, 1), encoding='utf-8')

          controller_path = root / 'apps/api/src/media/media.controller.ts'
          controller = controller_path.read_text(encoding='utf-8')
          controller = controller.replace(
              '  type AssetUploadSessionRecord,',
              '  type AssetUploadSessionView,',
          )
          controller = controller.replace(
              'Readonly<AssetUploadSessionRecord>',
              'Readonly<AssetUploadSessionView>',
          )
          controller_path.write_text(controller, encoding='utf-8')

          modules_path = root / 'packages/server/src/modules/index.ts'
          modules = modules_path.read_text(encoding='utf-8')
          export_line = "export * from './media';"
          if export_line not in modules:
              modules_path.write_text(modules.rstrip() + '\n' + export_line + '\n', encoding='utf-8')

          for workflow in (root / '.github/workflows').glob('*phase8*once.yml'):
              workflow.unlink()
          (root / '.github/workflows/complete-phase8-upload-foundation-once.yml').unlink(missing_ok=True)

          for path in [
              root / 'scripts/apply-phase8-media.py',
              root / 'scripts/finalize-phase8-media.py',
              root / 'scripts/finalize-phase8-media-v2.py',
              root / 'scripts/repair-phase8-media.py',
          ]:
              path.unlink(missing_ok=True)
          shutil.rmtree(root / '.atlas-phase8', ignore_errors=True)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format product source
        run: pnpm format

      - name: Verify product source
        run: |
          pnpm format:check
          pnpm check
          docker compose config > /dev/null

      - name: Commit clean product tree
        run: |
          rm -f .github/workflows/finalize-asset-upload-foundation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: finalize private Asset upload foundation'
          git push origin HEAD:feat/minio-media
