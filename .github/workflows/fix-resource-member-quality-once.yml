name: Fix Resource Member Quality Once

on:
  push:
    branches:
      - feat/resource-member-directory-mvp

permissions:
  contents: write

concurrency:
  group: fix-resource-member-quality-once
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/resource-member-directory-mvp

      - name: Apply export, lint and validation fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          domain = Path('packages/server/src/modules/resource-member/domain/resource-member.ts')
          value = domain.read_text(encoding='utf-8')
          value = value.replace(
              'export function isUuid(value: string): boolean {',
              'export function isResourceMemberUuid(value: string): boolean {',
          )
          value = value.replace('isUuid(', 'isResourceMemberUuid(')
          old_control_check = (
              "  if (normalizedSubject.length > 240 || "
              "/[\\u0000-\\u001f\\u007f]/u.test(normalizedSubject)) {"
          )
          new_control_check = (
              "  const hasControlCharacter = [...normalizedSubject].some((character) => {\n"
              "    const codePoint = character.codePointAt(0) ?? 0;\n"
              "    return codePoint < 32 || codePoint === 127;\n"
              "  });\n"
              "  if (normalizedSubject.length > 240 || hasControlCharacter) {"
          )
          value = value.replace(old_control_check, new_control_check)
          old_candidate = (
              "  const candidate = values.filter((value): value is string => Boolean(value)).join('\\n');"
          )
          new_candidate = (
              "  const candidate = values\n"
              "    .filter((value): value is string => Boolean(value))\n"
              "    .map((value) =>\n"
              "      value.replace(/\\bsecret:\\/\\/[A-Za-z0-9][A-Za-z0-9/_-]{2,255}\\b/gu, ''),\n"
              "    )\n"
              "    .join('\\n');"
          )
          value = value.replace(old_candidate, new_candidate)
          domain.write_text(value, encoding='utf-8')

          service = Path('packages/server/src/modules/resource-member/application/resource-member.service.ts')
          value = service.read_text(encoding='utf-8')
          value = value.replace('  ResourceRelationType,\n', '')
          value = value.replace('  isUuid,\n', '  isResourceMemberUuid,\n')
          value = value.replace('!isUuid(', '!isResourceMemberUuid(')
          service.write_text(value, encoding='utf-8')

          port = Path('packages/server/src/modules/resource-member/ports/resource-member.repository.ts')
          value = port.read_text(encoding='utf-8')
          value = value.replace('export interface UpdateResourceInput {', 'export interface UpdateResourceRecordInput {')
          value = value.replace('export interface UpdateMemberInput {', 'export interface UpdateMemberRecordInput {')
          value = value.replace('input: UpdateResourceInput,', 'input: UpdateResourceRecordInput,')
          value = value.replace('input: UpdateMemberInput,', 'input: UpdateMemberRecordInput,')
          port.write_text(value, encoding='utf-8')

          repository = Path('packages/server/src/modules/resource-member/infrastructure/persistence/typeorm-resource-member.repository.ts')
          value = repository.read_text(encoding='utf-8')
          value = value.replace('  ResourceAssetEntity,\n', '')
          value = value.replace('  UpdateMemberInput,\n', '  UpdateMemberRecordInput,\n')
          value = value.replace('  UpdateResourceInput,\n', '  UpdateResourceRecordInput,\n')
          value = value.replace('input: UpdateResourceInput,', 'input: UpdateResourceRecordInput,')
          value = value.replace('input: UpdateMemberInput,', 'input: UpdateMemberRecordInput,')
          repository.write_text(value, encoding='utf-8')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and verify
        run: |
          pnpm format
          pnpm format:check
          pnpm check
          bash -n scripts/backup/*.sh

      - name: Commit verified fixes
        run: |
          rm -f .github/workflows/fix-resource-member-quality-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: resolve resource member module quality issues'
          git push origin HEAD:feat/resource-member-directory-mvp
