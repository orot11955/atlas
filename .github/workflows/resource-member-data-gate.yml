name: Resource Member Data Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: atlas-resource-member-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      PORT: 4000
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY: 'false'
      AUTH_LOGIN_FINGERPRINT_PEPPER: atlas-ci-admin-login-fingerprint-secret
      AUTH_MFA_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      AUTH_MFA_ENCRYPTION_KEY_VERSION: ci-v1
      AUTH_MFA_RECOVERY_CODE_PEPPER: atlas-ci-admin-recovery-code-pepper-2026
      AUTH_MFA_ISSUER: Atlas CI
      AUTH_MFA_WINDOW_STEPS: 1
      AUTH_MFA_GRANT_SECONDS: 120
      AUTH_MFA_RECOVERY_CODE_COUNT: 10
      AUTH_MFA_FAILURE_THRESHOLD: 5
      AUTH_SESSION_FINGERPRINT_PEPPER: atlas-ci-admin-session-fingerprint-secret
      AUTH_SESSION_IDLE_SECONDS: 1800
      AUTH_SESSION_ABSOLUTE_SECONDS: 43200
      AUTH_SESSION_TOUCH_SECONDS: 60
      AUTH_SESSION_MAX_ACTIVE: 5
      AUTH_SESSION_BIND_IP: 'false'
      AUTH_SESSION_COOKIE_NAME: atlas_admin_session
      AUTH_CSRF_COOKIE_NAME: atlas_admin_csrf
      AUTH_COOKIE_SECURE: 'false'
      API_KEY_PEPPER: atlas-ci-api-key-pepper-with-sufficient-random-length
      API_KEY_USAGE_TOUCH_SECONDS: 1
      DATABASE_URL: postgresql://atlas:atlas-ci-password@localhost:5432/atlas_phase5
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: atlas-ci-api
      MINIO_SECRET_KEY: atlas-ci-api-secret
      MINIO_PRIVATE_BUCKET: atlas-private
      MINIO_PROCESSING_BUCKET: atlas-processing
      MINIO_PUBLIC_BUCKET: atlas-public
      MINIO_PUBLIC_BASE_URL: http://localhost:9000/atlas-public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atlas_phase5
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_phase5"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate backup scripts
        run: bash -n scripts/backup/*.sh

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Apply migrations
        run: pnpm db:migration:run

      - name: Backup and isolated restore test
        run: |
          archive="$(
            BACKUP_DATABASE_URL="${DATABASE_URL}" \
            BACKUP_ROOT="${RUNNER_TEMP}/atlas-backups" \
            bash scripts/backup/postgres-backup.sh
          )"
          RESTORE_TEST_DATABASE_URL='postgresql://atlas:atlas-ci-password@localhost:5432/postgres' \
            bash scripts/backup/postgres-restore-test.sh "$archive"

      - name: Bootstrap OWNER
        run: |
          owner_password="Atlas-phase5-$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"
          printf '%s\n%s\n' "$owner_password" "$owner_password" |
            pnpm admin:bootstrap-owner -- \
              --email owner-phase5@atlas.test \
              --display-name 'Phase 5 Owner' \
              --password-stdin \
              --json
          printf '%s' "$owner_password" > /tmp/atlas-owner-password
          chmod 600 /tmp/atlas-owner-password

      - name: Verify Resource and Member API
        run: |
          pnpm build:packages
          pnpm --filter @atlas/api build
          pnpm --filter @atlas/api start > /tmp/atlas-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; rm -f /tmp/atlas-owner-password' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health/live > /dev/null; then break; fi
            if [ "$attempt" = '30' ]; then cat /tmp/atlas-api.log; exit 1; fi
            sleep 1
          done
          ATLAS_OWNER_PASSWORD="$(cat /tmp/atlas-owner-password)" \
            node scripts/ci/resource-member-full-e2e.mjs
