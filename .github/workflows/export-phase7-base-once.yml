name: Export Phase 7 base once

on:
  push:
    branches:
      - feat/content-publication-delivery
    paths:
      - .github/workflows/export-phase7-base-once.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 7 branch
        uses: actions/checkout@v7
        with:
          ref: feat/content-publication-delivery

      - name: Archive repository source
        run: git archive --format=zip --output=/tmp/atlas-phase7-base.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: atlas-phase7-base
          path: /tmp/atlas-phase7-base.zip
          if-no-files-found: error
          retention-days: 1
