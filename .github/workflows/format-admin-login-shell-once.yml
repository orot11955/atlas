name: Format admin login shell once

on:
  push:
    branches:
      - feat/admin-login-shell

permissions:
  contents: write

concurrency:
  group: format-admin-login-shell-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/admin-login-shell

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repository
        run: pnpm format

      - name: Commit formatting
        run: |
          rm -f .github/workflows/format-admin-login-shell-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format administrator login shell'
          git push origin HEAD:feat/admin-login-shell
