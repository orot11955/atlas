name: Align Phase 5 roadmap once

on:
  push:
    branches:
      - docs/align-phase-5-roadmap

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: docs/align-phase-5-roadmap

      - name: Align progress document with implementation roadmap
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/implementation/progress.md')
          content = path.read_text(encoding='utf-8')
          old = (
              "## 완료\n\n"
              "### Phase 4. Project & Deployment Read Model\n\n"
              "- Workspace-scoped Project와 Site 연결\n"
              "- Project Timeline, Repository Connection과 Release\n"
              "- Environment, Service와 Service Environment\n"
              "- 사전 등록 Health URL과 Timeout\n"
              "- Deployment와 Deployment Event Read Model\n"
              "- 배포 상태와 Health 상태의 독립 저장·조회\n"
              "- Integration API Client Scope 기반 CI Callback\n"
              "- PostgreSQL Advisory Lock과 Idempotency Record\n"
              "- Project·Deployment Admin 화면\n"
              "- 실제 PostgreSQL·Redis·NestJS 통합 E2E\n\n"
              "## 다음\n\n"
              "### Phase 5. Content Authoring Core\n\n"
              "```text\n"
              "Post와 Page Schema\n"
              "→ Content Revision\n"
              "→ Draft 저장과 Optimistic Lock\n"
              "→ Category와 Tag\n"
              "→ Preview Token\n"
              "→ Content Admin Editor\n"
              "```\n"
          )
          new = (
              "### Phase 4. Project & Deployment Read Model\n\n"
              "- Workspace-scoped Project와 Site 연결\n"
              "- Project Timeline, Repository Connection과 Release\n"
              "- Environment, Service와 Service Environment\n"
              "- 사전 등록 Health URL과 Timeout\n"
              "- Deployment와 Deployment Event Read Model\n"
              "- 배포 상태와 Health 상태의 독립 저장·조회\n"
              "- Integration API Client Scope 기반 CI Callback\n"
              "- PostgreSQL Advisory Lock과 Idempotency Record\n"
              "- Project·Deployment Admin 화면\n"
              "- 실제 PostgreSQL·Redis·NestJS 통합 E2E\n\n"
              "주요 Pull Request:\n\n"
              "- [#16 Project and Deployment Read Model](https://github.com/orot11955/atlas/pull/16)\n\n"
              "## 다음\n\n"
              "### Phase 5. Resource & Member Directory MVP\n\n"
              "```text\n"
              "ResourceCollection과 Resource\n"
              "→ Markdown 메모·문서와 외부 Link\n"
              "→ Tag·Relation과 Project 연결\n"
              "→ Visibility·Sensitivity·Archive\n"
              "→ PostgreSQL·MinIO Backup과 Restore Test\n"
              "→ Member와 SiteMembership\n"
              "→ Site별 상태와 관리자 메모\n"
              "```\n\n"
              "회원 Password, Session과 Email Verification은 Phase 12에서 구현한다.\n"
          )

          if content.count(old) != 1:
              raise RuntimeError('Expected Phase 4/5 progress block was not found exactly once.')

          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit aligned roadmap
        run: |
          rm -f .github/workflows/align-phase-5-roadmap-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: align Phase 5 progress with roadmap'
          git push origin HEAD:docs/align-phase-5-roadmap
