name: Apply Content Editor Assets Once

on:
  push:
    branches:
      - feat/media-content-editor-assets

permissions:
  contents: write

concurrency:
  group: atlas-apply-content-editor-assets-once
  cancel-in-progress: false

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/media-content-editor-assets
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reassemble and apply Content Editor Asset Picker patch
        env:
          PATCH_SHA256: 3ef666ad41d683e01e36f3197d0ae1d278ce4040b8caa93443ead96b6ae16d8e
        run: |
          cat .github/patches/content-editor-assets/part-*.b64 |
            tr -d '\n\r ' |
            base64 --decode > /tmp/atlas-content-editor-assets.patch.gz
          echo "$PATCH_SHA256  /tmp/atlas-content-editor-assets.patch.gz" | sha256sum --check --strict
          gzip -dc /tmp/atlas-content-editor-assets.patch.gz > /tmp/atlas-content-editor-assets.patch
          git apply --check /tmp/atlas-content-editor-assets.patch
          git apply /tmp/atlas-content-editor-assets.patch
          rm -rf .github/patches/content-editor-assets
          rm -f .github/workflows/apply-content-editor-assets-once.yml

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/admin-web/src/content-asset-picker.test.ts \
            apps/admin-web/src/features/content/content-asset-picker.tsx \
            apps/admin-web/src/features/content/content-editor.tsx \
            apps/admin-web/src/features/content/content.module.css \
            apps/admin-web/src/features/media/asset-api.ts \
            apps/admin-web/src/features/media/asset-types.ts \
            apps/api/src/media/media.controller.ts \
            apps/api/src/media/media.module.ts \
            apps/api/src/media/media.tokens.ts \
            docs/implementation/phase-8-3-media-content-integration.md \
            packages/server/src/asset-variant-query.test.ts \
            packages/server/src/modules/media/application/asset-variant.service.ts \
            packages/server/src/modules/media/index.ts \
            packages/server/src/modules/media/ports/asset-public-url-builder.port.ts \
            scripts/ci/asset-upload-e2e.mjs

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add Content Editor Asset Picker'
          git push origin HEAD:feat/media-content-editor-assets
