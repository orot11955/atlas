name: Finalize PR 28 Once

on:
  push:
    branches:
      - feat/media-content-editor-assets

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: atlas-finalize-pr28-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      FEATURE_BRANCH: feat/media-content-editor-assets
      NEXT_BRANCH: feat/media-lifecycle-completion
      PR_NUMBER: '28'

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/media-content-editor-assets
          fetch-depth: 0

      - name: Remove one-time finalizer
        id: final-head
        run: |
          rm -f .github/workflows/finalize-pr28-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/finalize-pr28-once.yml
          git commit -m 'chore: remove PR 28 finalizer workflow'
          git push origin HEAD:"$FEATURE_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head required workflows
        run: |
          expected='${{ steps.final-head.outputs.sha }}'
          remote="$(gh api "repos/$REPOSITORY/branches/$FEATURE_BRANCH" --jq '.commit.sha')"
          test "$expected" = "$remote"
          gh workflow run ci.yml --repo "$REPOSITORY" --ref "$FEATURE_BRANCH"
          gh workflow run resource-member-data-gate.yml --repo "$REPOSITORY" --ref "$FEATURE_BRANCH"
          gh workflow run media-data-gate.yml --repo "$REPOSITORY" --ref "$FEATURE_BRANCH"

      - name: Require exact-head workflow success
        run: |
          set -euo pipefail
          expected='${{ steps.final-head.outputs.sha }}'

          wait_for_workflow() {
            workflow="$1"
            run_id=''

            for _ in $(seq 1 90); do
              run_id="$(
                gh api -X GET "repos/$REPOSITORY/actions/workflows/$workflow/runs" \
                  -f branch="$FEATURE_BRANCH" \
                  -f event='workflow_dispatch' \
                  -f per_page=20 \
                  --jq ".workflow_runs[] | select(.head_sha == \"$expected\") | .id" |
                  head -n 1
              )"
              if [ -n "$run_id" ]; then break; fi
              sleep 4
            done

            test -n "$run_id"

            for _ in $(seq 1 360); do
              status="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.status')"
              if [ "$status" = 'completed' ]; then
                conclusion="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.conclusion')"
                echo "$workflow: $conclusion"
                test "$conclusion" = 'success'
                return
              fi
              sleep 5
            done

            echo "Timed out waiting for $workflow" >&2
            return 1
          }

          wait_for_workflow ci.yml
          wait_for_workflow resource-member-data-gate.yml
          wait_for_workflow media-data-gate.yml

      - name: Mark ready and squash merge
        id: merge
        run: |
          expected='${{ steps.final-head.outputs.sha }}'
          actual="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          test "$expected" = "$actual"
          test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.mergeable')" = 'true'

          gh api graphql \
            -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}' \
            -f id="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.node_id')"

          gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method='squash' \
            -f sha="$expected" \
            -f commit_title='feat: add Content Editor Asset Picker' \
            -f commit_message='Phase 8-3 Content Editor READY Asset Picker and safe Public Variant preview' \
            --jq '.merged == true'

          develop="$(gh api "repos/$REPOSITORY/branches/develop" --jq '.commit.sha')"
          echo "develop=$develop" >> "$GITHUB_OUTPUT"

      - name: Dispatch develop verification
        run: |
          gh workflow run ci.yml --repo "$REPOSITORY" --ref develop
          gh workflow run resource-member-data-gate.yml --repo "$REPOSITORY" --ref develop
          gh workflow run media-data-gate.yml --repo "$REPOSITORY" --ref develop

      - name: Require develop verification and create next branch
        run: |
          set -euo pipefail
          expected='${{ steps.merge.outputs.develop }}'

          wait_for_workflow() {
            workflow="$1"
            run_id=''
            for _ in $(seq 1 90); do
              run_id="$(
                gh api -X GET "repos/$REPOSITORY/actions/workflows/$workflow/runs" \
                  -f branch='develop' \
                  -f event='workflow_dispatch' \
                  -f per_page=20 \
                  --jq ".workflow_runs[] | select(.head_sha == \"$expected\") | .id" |
                  head -n 1
              )"
              if [ -n "$run_id" ]; then break; fi
              sleep 4
            done
            test -n "$run_id"

            for _ in $(seq 1 360); do
              status="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.status')"
              if [ "$status" = 'completed' ]; then
                conclusion="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.conclusion')"
                echo "$workflow: $conclusion"
                test "$conclusion" = 'success'
                return
              fi
              sleep 5
            done
            return 1
          }

          wait_for_workflow ci.yml
          wait_for_workflow resource-member-data-gate.yml
          wait_for_workflow media-data-gate.yml

          existing="$(gh api "repos/$REPOSITORY/git/matching-refs/heads/$NEXT_BRANCH" --jq 'length')"
          if [ "$existing" = '0' ]; then
            gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f ref="refs/heads/$NEXT_BRANCH" \
              -f sha="$expected"
          fi
