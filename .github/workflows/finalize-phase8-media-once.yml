name: Finalize Phase 8 Media once

on:
  push:
    branches:
      - feat/minio-media
    paths:
      - scripts/finalize-phase8-media.py
      - .github/workflows/finalize-phase8-media-once.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: atlas-phase8-media-finalize
  cancel-in-progress: true

env:
  NODE_ENV: test
  PORT: 4000
  CORS_ORIGINS: http://localhost:3000
  TRUST_PROXY: 'false'
  AUTH_LOGIN_FINGERPRINT_PEPPER: atlas-phase8-login-fingerprint-secret
  AUTH_MFA_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  AUTH_MFA_ENCRYPTION_KEY_VERSION: phase8-v1
  AUTH_MFA_RECOVERY_CODE_PEPPER: atlas-phase8-recovery-code-pepper
  AUTH_MFA_ISSUER: Atlas Phase 8
  AUTH_MFA_WINDOW_STEPS: '1'
  AUTH_MFA_GRANT_SECONDS: '120'
  AUTH_MFA_RECOVERY_CODE_COUNT: '10'
  AUTH_MFA_FAILURE_THRESHOLD: '5'
  AUTH_SESSION_FINGERPRINT_PEPPER: atlas-phase8-session-fingerprint-secret
  AUTH_SESSION_IDLE_SECONDS: '1800'
  AUTH_SESSION_ABSOLUTE_SECONDS: '43200'
  AUTH_SESSION_TOUCH_SECONDS: '60'
  AUTH_SESSION_MAX_ACTIVE: '5'
  AUTH_SESSION_BIND_IP: 'false'
  AUTH_SESSION_COOKIE_NAME: atlas_admin_session
  AUTH_CSRF_COOKIE_NAME: atlas_admin_csrf
  AUTH_COOKIE_SECURE: 'false'
  API_KEY_PEPPER: atlas-phase8-api-key-pepper-with-sufficient-length
  API_KEY_USAGE_TOUCH_SECONDS: '1'
  DATABASE_URL: postgresql://atlas:atlas-phase8-password@localhost:5432/atlas_phase8
  REDIS_URL: redis://localhost:6379/0
  MINIO_ENDPOINT: http://localhost:9000
  MINIO_PRESIGN_ENDPOINT: http://localhost:9000
  MINIO_ACCESS_KEY: atlas-phase8-api
  MINIO_SECRET_KEY: atlas-phase8-api-secret
  MINIO_PRIVATE_BUCKET: atlas-private
  MINIO_PROCESSING_BUCKET: atlas-processing
  MINIO_PUBLIC_BUCKET: atlas-public
  MINIO_PUBLIC_BASE_URL: http://localhost:9000/atlas-public
  ASSET_UPLOAD_TTL_SECONDS: '900'
  ASSET_UPLOAD_MAX_BYTES: '26214400'

jobs:
  verify-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atlas_phase8
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-phase8-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_phase8"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout Phase 8 branch
        uses: actions/checkout@v7
        with:
          ref: feat/minio-media
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Apply final product integration and remove scaffolding
        run: |
          python3 scripts/finalize-phase8-media.py
          rm -f scripts/finalize-phase8-media.py
          rm -f scripts/repair-phase8-media.py
          rm -f scripts/apply-phase8-media.py
          rm -f .github/workflows/finalize-phase8-media-once.yml
          rm -f .github/workflows/repair-phase8-media-once.yml
          rm -f .github/workflows/apply-phase8-media-once.yml
          rm -f .github/workflows/export-phase8-base-once.yml
          rm -f .github/workflows/export-phase8-deps-once.yml
          rm -f packages/server/src/asset-upload.test.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format product tree
        run: pnpm prettier --write .

      - name: Verify quality
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          docker compose config > /dev/null

      - name: Verify migration lifecycle
        run: |
          pnpm db:migration:run
          pnpm db:migration:show | grep -F 'No pending migrations.'
          pnpm db:migration:revert
          pnpm db:migration:run
          pnpm db:migration:show | grep -F 'No pending migrations.'

      - name: Start MinIO and create private media buckets
        run: |
          docker run -d --name atlas-phase8-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            minio/minio:latest server /data

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live > /dev/null; then
              break
            fi
            if [ "$attempt" = '30' ]; then
              docker logs atlas-phase8-minio
              exit 1
            fi
            sleep 1
          done

          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c "
            mc alias set local http://127.0.0.1:9000 '$MINIO_ACCESS_KEY' '$MINIO_SECRET_KEY' &&
            mc mb --ignore-existing local/$MINIO_PRIVATE_BUCKET &&
            mc mb --ignore-existing local/$MINIO_PROCESSING_BUCKET &&
            mc mb --ignore-existing local/$MINIO_PUBLIC_BUCKET
          "

      - name: Bootstrap OWNER
        run: |
          owner_password="Atlas-phase8-$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"
          printf '%s\n%s\n' "$owner_password" "$owner_password" |
            pnpm admin:bootstrap-owner -- \
              --email owner-phase8@atlas.test \
              --display-name 'Phase 8 Owner' \
              --password-stdin \
              --json
          printf '%s' "$owner_password" > /tmp/atlas-owner-password
          chmod 600 /tmp/atlas-owner-password

      - name: Verify authenticated MinIO Asset lifecycle
        run: |
          pnpm build:packages
          pnpm --filter @atlas/api build
          pnpm --filter @atlas/api start > /tmp/atlas-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; rm -f /tmp/atlas-owner-password' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health/live > /dev/null; then
              break
            fi
            if [ "$attempt" = '30' ]; then
              cat /tmp/atlas-api.log
              exit 1
            fi
            sleep 1
          done

          ATLAS_OWNER_EMAIL=owner-phase8@atlas.test \
          ATLAS_OWNER_PASSWORD="$(cat /tmp/atlas-owner-password)" \
            node scripts/ci/admin-auth-e2e.mjs

      - name: Verify Asset database invariants
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM assets WHERE status='uploaded'")" -ge 1
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM assets WHERE status='failed'")" -ge 1
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM asset_upload_sessions WHERE status='pending'")" = '0'
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM assets WHERE original_object_key IS NULL OR original_object_key = ''")" = '0'

      - name: Record verified product tree
        run: |
          mkdir -p docs/implementation/verification
          cat > docs/implementation/verification/phase-8-private-asset-upload.md <<EOF
          # Phase 8 Private Asset Upload verification

          - Branch commit before finalization: ${GITHUB_SHA}
          - Workflow run: ${GITHUB_RUN_ID}
          - Result: success
          - Verified: Prettier, ESLint, Typecheck, Unit Test and Production Build
          - Verified: Migration up → down → up
          - Verified: authenticated Presigned PUT to a real MinIO server
          - Verified: server-side size, SHA-256 and image Magic Byte validation
          - Verified: disguised SVG rejection and failed-session persistence
          - Verified: idempotent upload completion
          - Verified: Admin DTO storage-internal field exclusion
          EOF
          pnpm prettier --write docs/implementation/verification/phase-8-private-asset-upload.md

      - name: Commit verified product code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && {
            echo 'Finalizer produced no product changes.' >&2
            exit 1
          }
          git commit -m 'feat: verify private Asset upload end to end'
          git push origin HEAD:feat/minio-media

      - name: Merge verified Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head feat/minio-media \
            --base develop \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base develop \
              --head feat/minio-media \
              --title 'feat: add private Asset upload foundation' \
              --body 'Verified Phase 8 private Asset upload vertical slice.')"
            pr_number="${pr_url##*/}"
          fi

          gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY" || true
          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --subject 'feat: add private Asset upload foundation' \
            --body 'Add verified private original upload sessions, Presigned PUT, server-side object validation, Admin API and upload UI.'

          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref develop || true
