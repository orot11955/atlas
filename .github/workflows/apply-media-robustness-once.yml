name: Apply Media Robustness Once

on:
  push:
    branches:
      - feat/media-processing-variants
    paths:
      - .github/workflows/apply-media-robustness-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/media-processing-variants
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply robustness fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text()
              if old not in content:
                  raise RuntimeError(f"Expected block was not found in {path}: {old[:100]!r}")
              target.write_text(content.replace(old, new, 1))

          asset_service = "packages/server/src/modules/media/application/asset.service.ts"
          replace(
              asset_service,
              "  detectAssetImageContentType,\n  normalizeAssetContentType,",
              "  detectAssetImageContentType,\n  isAssetUploadCompleted,\n  normalizeAssetContentType,",
          )
          replace(
              asset_service,
              (
                  "      if (\n"
                  "        aggregate.asset.status === AssetStatus.UPLOADED &&\n"
                  "        aggregate.session.status === AssetUploadSessionStatus.COMPLETED\n"
                  "      ) {"
              ),
              (
                  "      if (\n"
                  "        aggregate.session.status === AssetUploadSessionStatus.COMPLETED &&\n"
                  "        isAssetUploadCompleted(aggregate.asset)\n"
                  "      ) {"
              ),
          )
          replace(
              asset_service,
              (
                  "    uploadedAt: asset.uploadedAt ? new Date(asset.uploadedAt) : undefined,\n"
                  "    failedAt: asset.failedAt ? new Date(asset.failedAt) : undefined,"
              ),
              (
                  "    uploadedAt: asset.uploadedAt ? new Date(asset.uploadedAt) : undefined,\n"
                  "    processedAt: asset.processedAt ? new Date(asset.processedAt) : undefined,\n"
                  "    failedAt: asset.failedAt ? new Date(asset.failedAt) : undefined,"
              ),
          )

          asset_repository = (
              "packages/server/src/modules/media/infrastructure/persistence/"
              "typeorm-asset.repository.ts"
          )
          replace(
              asset_repository,
              "      originalEtag: asset.originalEtag ?? null,\n      version: asset.version,",
              (
                  "      originalEtag: asset.originalEtag ?? null,\n"
                  "      width: asset.width ?? null,\n"
                  "      height: asset.height ?? null,\n"
                  "      processingFailureCode: asset.processingFailureCode ?? null,\n"
                  "      version: asset.version,"
              ),
          )
          replace(
              asset_repository,
              "      uploadedAt: asset.uploadedAt ?? null,\n      failedAt: asset.failedAt ?? null,",
              (
                  "      uploadedAt: asset.uploadedAt ?? null,\n"
                  "      processedAt: asset.processedAt ?? null,\n"
                  "      failedAt: asset.failedAt ?? null,"
              ),
          )
          replace(
              asset_repository,
              (
                  "        originalEtag: input.originalEtag,\n"
                  "        version: () => 'version + 1',\n"
                  "        uploadedAt: input.completedAt,\n"
                  "        failedAt: null,"
              ),
              (
                  "        originalEtag: input.originalEtag,\n"
                  "        width: null,\n"
                  "        height: null,\n"
                  "        processingFailureCode: null,\n"
                  "        version: () => 'version + 1',\n"
                  "        uploadedAt: input.completedAt,\n"
                  "        processedAt: null,\n"
                  "        failedAt: null,"
              ),
          )
          replace(
              asset_repository,
              (
                  "        status: AssetStatus.FAILED,\n"
                  "        version: () => 'version + 1',\n"
                  "        failedAt: input.failedAt,"
              ),
              (
                  "        status: AssetStatus.FAILED,\n"
                  "        width: null,\n"
                  "        height: null,\n"
                  "        processingFailureCode: null,\n"
                  "        version: () => 'version + 1',\n"
                  "        processedAt: null,\n"
                  "        failedAt: input.failedAt,"
              ),
          )
          replace(
              asset_repository,
              "    originalEtag: entity.originalEtag ?? undefined,\n    version: entity.version,",
              (
                  "    originalEtag: entity.originalEtag ?? undefined,\n"
                  "    width: entity.width ?? undefined,\n"
                  "    height: entity.height ?? undefined,\n"
                  "    processingFailureCode: entity.processingFailureCode ?? undefined,\n"
                  "    version: entity.version,"
              ),
          )
          replace(
              asset_repository,
              (
                  "    uploadedAt: entity.uploadedAt ? new Date(entity.uploadedAt) : undefined,\n"
                  "    failedAt: entity.failedAt ? new Date(entity.failedAt) : undefined,"
              ),
              (
                  "    uploadedAt: entity.uploadedAt ? new Date(entity.uploadedAt) : undefined,\n"
                  "    processedAt: entity.processedAt ? new Date(entity.processedAt) : undefined,\n"
                  "    failedAt: entity.failedAt ? new Date(entity.failedAt) : undefined,"
              ),
          )

          processing_repository = (
              "packages/server/src/modules/media/infrastructure/persistence/"
              "typeorm-asset-processing.repository.ts"
          )
          replace(
              processing_repository,
              (
                  "      if (\n"
                  "        !activeAttempt ||\n"
                  "        new Date(activeAttempt.startedAt).getTime() > input.staleBefore.getTime()\n"
                  "      ) {\n"
                  "        return Object.freeze({\n"
                  "          kind: 'busy' as const,\n"
                  "          asset: toAssetRecord(asset),\n"
                  "        });\n"
                  "      }\n\n"
                  "      await attemptRepository.update(\n"
                  "        {\n"
                  "          id: activeAttempt.id,\n"
                  "          workspaceId,\n"
                  "          status: AssetProcessingAttemptStatus.PROCESSING,\n"
                  "        },\n"
                  "        {\n"
                  "          status: AssetProcessingAttemptStatus.FAILED,\n"
                  "          failedAt: input.startedAt,\n"
                  "          failureCode: 'asset_processing_stale',\n"
                  "          updatedAt: input.startedAt,\n"
                  "        },\n"
                  "      );"
              ),
              (
                  "      if (\n"
                  "        activeAttempt &&\n"
                  "        new Date(activeAttempt.startedAt).getTime() > input.staleBefore.getTime()\n"
                  "      ) {\n"
                  "        return Object.freeze({\n"
                  "          kind: 'busy' as const,\n"
                  "          asset: toAssetRecord(asset),\n"
                  "        });\n"
                  "      }\n\n"
                  "      if (activeAttempt) {\n"
                  "        await attemptRepository.update(\n"
                  "          {\n"
                  "            id: activeAttempt.id,\n"
                  "            workspaceId,\n"
                  "            status: AssetProcessingAttemptStatus.PROCESSING,\n"
                  "          },\n"
                  "          {\n"
                  "            status: AssetProcessingAttemptStatus.FAILED,\n"
                  "            failedAt: input.startedAt,\n"
                  "            failureCode: 'asset_processing_stale',\n"
                  "            updatedAt: input.startedAt,\n"
                  "          },\n"
                  "        );\n"
                  "      }"
              ),
          )
          attempt_insert = (
              "    await attemptRepository.insert({\n"
              "      id: attempt.id,\n"
              "      workspaceId: attempt.workspaceId,\n"
              "      assetId: attempt.assetId,\n"
              "      jobId: attempt.jobId,\n"
              "      attemptNumber: attempt.attemptNumber,\n"
              "      status: attempt.status,\n"
              "      startedAt: attempt.startedAt,\n"
              "      completedAt: null,\n"
              "      failedAt: null,\n"
              "      failureCode: null,\n"
              "      createdAt: attempt.createdAt,\n"
              "      updatedAt: attempt.updatedAt,\n"
              "    });\n\n"
          )
          claim_update = (
              "    const claimed = await assetRepository.update(\n"
              "      {\n"
              "        id: assetId,\n"
              "        workspaceId,\n"
              "        status: asset.status,\n"
              "      },\n"
              "      {\n"
              "        status: AssetStatus.PROCESSING,\n"
              "        processingFailureCode: null,\n"
              "        failedAt: null,\n"
              "        version: () => 'version + 1',\n"
              "        updatedAt: input.startedAt,\n"
              "      },\n"
              "    );\n\n"
              "    if ((claimed.affected ?? 0) !== 1) {\n"
              "      return Object.freeze({\n"
              "        kind: 'busy' as const,\n"
              "        asset: assetRecord,\n"
              "      });\n"
              "    }\n"
          )
          replace(
              processing_repository,
              attempt_insert + claim_update,
              claim_update + "\n" + attempt_insert.rstrip(),
          )

          asset_test = "packages/server/src/asset-upload.test.ts"
          replace(
              asset_test,
              (
                  "      assert.equal(storage.copied, true);\n"
                  "      assert.equal(repository.aggregate?.session.status, AssetUploadSessionStatus.COMPLETED);\n"
                  "      assert.deepEqual("
              ),
              (
                  "      assert.equal(storage.copied, true);\n"
                  "      assert.equal(storage.copyCount, 1);\n"
                  "      assert.equal(repository.aggregate?.session.status, AssetUploadSessionStatus.COMPLETED);\n\n"
                  "      if (!repository.aggregate) {\n"
                  "        throw new Error('Expected completed Asset aggregate.');\n"
                  "      }\n"
                  "      repository.aggregate.asset = {\n"
                  "        ...repository.aggregate.asset,\n"
                  "        status: AssetStatus.PROCESSING,\n"
                  "      };\n"
                  "      const repeated = await service.completeUpload(\n"
                  "        repository.workspaceId,\n"
                  "        created.session.id,\n"
                  "      );\n\n"
                  "      assert.equal(repeated.status, AssetStatus.PROCESSING);\n"
                  "      assert.equal(storage.copyCount, 1);\n"
                  "      assert.deepEqual("
              ),
          )
          replace(
              asset_test,
              "  public copied = false;",
              (
                  "  public copyCount = 0;\n\n"
                  "  public get copied(): boolean {\n"
                  "    return this.copyCount > 0;\n"
                  "  }"
              ),
          )
          replace(
              asset_test,
              "  public async copyObject(): Promise<void> {\n    this.copied = true;\n  }",
              "  public async copyObject(): Promise<void> {\n    this.copyCount += 1;\n  }",
          )
          PY

          pnpm exec prettier --write \
            packages/server/src/modules/media/application/asset.service.ts \
            packages/server/src/modules/media/infrastructure/persistence/typeorm-asset.repository.ts \
            packages/server/src/modules/media/infrastructure/persistence/typeorm-asset-processing.repository.ts \
            packages/server/src/asset-upload.test.ts

      - name: Verify server package
        run: |
          pnpm --filter @atlas/server lint
          pnpm --filter @atlas/server typecheck
          pnpm --filter @atlas/server test

      - name: Commit fixes
        run: |
          git config user.name "Juho"
          git config user.email "134906793+orot11955@users.noreply.github.com"
          git add packages/server/src
          git commit -m "fix(media): harden upload and processing transitions"
          git push origin HEAD:feat/media-processing-variants
