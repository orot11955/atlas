name: Format roadmap v2 once

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format roadmap and remove workflow
        run: |
          pnpm prettier --write docs/implementation-roadmap.md
          rm .github/workflows/format-roadmap-v2-once.yml

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/implementation-roadmap.md .github/workflows/format-roadmap-v2-once.yml
          git commit -m 'style: format revised implementation roadmap'
          git push origin HEAD:develop
