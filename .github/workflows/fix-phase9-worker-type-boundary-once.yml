name: Fix Phase 9 Worker Type Boundary Once

on:
  push:
    branches:
      - feat/outbox-webhook-scheduling
    paths:
      - .github/workflows/fix-phase9-worker-type-boundary-once.yml

permissions:
  contents: write

concurrency:
  group: atlas-fix-phase9-worker-type-boundary-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/outbox-webhook-scheduling
          fetch-depth: 0

      - name: Route EntityManager through database package
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          database_index = Path('packages/database/src/index.ts')
          database_source = database_index.read_text(encoding='utf-8')
          export_line = "export type { EntityManager } from 'typeorm';\n"
          if export_line not in database_source:
              database_index.write_text(database_source.rstrip() + '\n' + export_line, encoding='utf-8')

          worker_module = Path('apps/worker/src/worker.module.ts')
          worker_source = worker_module.read_text(encoding='utf-8')
          old_import = "import type { EntityManager } from 'typeorm';\n"
          new_import = "import type { EntityManager } from '@atlas/database';\n"
          if old_import in worker_source:
              worker_source = worker_source.replace(old_import, new_import, 1)
          elif new_import not in worker_source:
              raise SystemExit('Unexpected Worker EntityManager import')
          worker_module.write_text(worker_source, encoding='utf-8')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Verify full typecheck
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write packages/database/src/index.ts apps/worker/src/worker.module.ts
          pnpm typecheck
          git diff --check

      - name: Commit boundary fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/src/index.ts apps/worker/src/worker.module.ts
          git commit -m 'fix: route Worker TypeORM types through database package'
          git push origin HEAD:feat/outbox-webhook-scheduling
