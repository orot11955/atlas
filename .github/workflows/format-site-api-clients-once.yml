name: Format Site API clients once

on:
  push:
    branches:
      - feat/site-api-clients

permissions:
  contents: write

concurrency:
  group: format-site-api-clients-once
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style: format Site API clients') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/site-api-clients
      - name: Stop if implementation is still staged
        run: test ! -f .atlas-api-client/apply.py
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format
      - name: Commit formatting
        run: |
          git rm .github/workflows/format-site-api-clients-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format Site API clients'
          git push origin HEAD:feat/site-api-clients
