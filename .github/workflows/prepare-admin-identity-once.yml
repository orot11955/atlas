name: Prepare admin identity once

on:
  push:
    branches:
      - feat/admin-identity-schema

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://atlas:atlas-ci-password@localhost:5432/atlas_ci

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atlas_ci
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/admin-identity-schema

      - name: Apply change bundle
        env:
          ATLAS_BUNDLE: 
        run: printf '%s' "$ATLAS_BUNDLE" | base64 --decode | tar -xz

      - name: Preserve permanent workflow
        run: git checkout -- .github/workflows/ci.yml

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install and update lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Apply formatting
        run: pnpm format

      - name: Commit implementation
        run: |
          rm .github/workflows/prepare-admin-identity-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add admin identity schema and owner bootstrap'
          git push origin HEAD:feat/admin-identity-schema

      - name: Verify workspace
        run: pnpm check

      - name: Verify migrations
        run: |
          pnpm db:migration:run
          pnpm db:migration:show | grep -F 'No pending migrations.'
          pnpm db:migration:revert
          pnpm db:migration:run
          pnpm db:migration:show | grep -F 'No pending migrations.'

      - name: Verify OWNER bootstrap
        run: |
          owner_password="Atlas-ci-$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"

          printf '%s\n%s\n' "$owner_password" "$owner_password" |
            pnpm admin:bootstrap-owner -- \
              --email owner-ci@atlas.test \
              --display-name 'CI Owner' \
              --password-stdin \
              --json

          if printf '%s\n%s\n' "$owner_password" "$owner_password" |
            pnpm admin:bootstrap-owner -- \
              --email second-owner-ci@atlas.test \
              --display-name 'Second CI Owner' \
              --password-stdin \
              --json; then
            echo 'Duplicate OWNER bootstrap unexpectedly succeeded.'
            exit 1
          fi
