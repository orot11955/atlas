name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BEGIN MEDIA FORMAT ONCE
  media-format-once:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/media-processing-variants' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/media-processing-variants
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Media processing changes
        run: |
          pnpm exec prettier --write \
            apps/admin-web/src/features/media/asset-types.ts \
            apps/worker/src/infrastructure/worker-database.service.ts \
            apps/worker/src/media/media-queue.worker.ts \
            apps/worker/src/media/media.tokens.ts \
            apps/worker/src/media/sharp-asset-image.processor.ts \
            apps/worker/src/sharp-asset-image.processor.test.ts \
            apps/worker/src/worker.module.ts \
            packages/config/src/index.ts \
            packages/server/src/asset-processing.test.ts \
            packages/server/src/modules/media/application/asset-processing.service.ts \
            packages/server/src/modules/media/index.ts \
            packages/server/src/modules/media/infrastructure/persistence/typeorm-asset-processing.repository.ts \
            packages/server/src/modules/media/ports/asset-image-processor.port.ts \
            packages/server/src/modules/media/ports/asset-processing-object-storage.port.ts

      - name: Remove one-time formatting Job
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = '  # BEGIN MEDIA FORMAT ONCE\n'
          end_marker = '  # END MEDIA FORMAT ONCE\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          workflow.write_text(text[:start] + text[end:], encoding='utf-8')
          PY
          pnpm exec prettier --write .github/workflows/ci.yml

      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi

          git commit -m 'chore: format Media processing worker'
          git push origin HEAD:feat/media-processing-variants
  # END MEDIA FORMAT ONCE

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PORT: 4000
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY: 'false'
      AUTH_LOGIN_FINGERPRINT_PEPPER: atlas-ci-admin-login-fingerprint-secret
      AUTH_MFA_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      AUTH_MFA_ENCRYPTION_KEY_VERSION: ci-v1
      AUTH_MFA_RECOVERY_CODE_PEPPER: atlas-ci-admin-recovery-code-pepper-2026
      AUTH_MFA_ISSUER: Atlas CI
      AUTH_MFA_WINDOW_STEPS: 1
      AUTH_MFA_GRANT_SECONDS: 120
      AUTH_MFA_RECOVERY_CODE_COUNT: 10
      AUTH_MFA_FAILURE_THRESHOLD: 5
      AUTH_SESSION_FINGERPRINT_PEPPER: atlas-ci-admin-session-fingerprint-secret
      AUTH_SESSION_IDLE_SECONDS: 1800
      AUTH_SESSION_ABSOLUTE_SECONDS: 43200
      AUTH_SESSION_TOUCH_SECONDS: 60
      AUTH_SESSION_MAX_ACTIVE: 5
      AUTH_SESSION_BIND_IP: 'false'
      AUTH_SESSION_COOKIE_NAME: atlas_admin_session
      AUTH_CSRF_COOKIE_NAME: atlas_admin_csrf
      AUTH_COOKIE_SECURE: 'false'
      API_KEY_PEPPER: atlas-ci-api-key-pepper-with-sufficient-random-length
      API_KEY_USAGE_TOUCH_SECONDS: 1
      DATABASE_URL: postgresql://atlas:atlas-ci-password@localhost:5432/atlas_ci
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: atlas-ci-api
      MINIO_SECRET_KEY: atlas-ci-api-secret
      MINIO_PRIVATE_BUCKET: atlas-private
      MINIO_PROCESSING_BUCKET: atlas-processing
      MINIO_PUBLIC_BUCKET: atlas-public
      MINIO_PUBLIC_BASE_URL: http://localhost:9000/atlas-public

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atlas_ci
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migration:run

      - name: Verify no pending migrations
        run: pnpm db:migration:show | grep -F 'No pending migrations.'

      - name: Verify rollback and re-apply
        run: |
          pnpm db:migration:revert
          pnpm db:migration:run
          pnpm db:migration:show | grep -F 'No pending migrations.'

      - name: Verify OWNER bootstrap and duplicate guard
        run: |
          owner_password="Atlas-ci-$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('base64url'))")"

          printf '%s\n%s\n' "$owner_password" "$owner_password" |
            pnpm admin:bootstrap-owner -- \
              --email owner-ci@atlas.test \
              --display-name 'CI Owner' \
              --password-stdin \
              --json

          if printf '%s\n%s\n' "$owner_password" "$owner_password" |
            pnpm admin:bootstrap-owner -- \
              --email second-owner-ci@atlas.test \
              --display-name 'Second CI Owner' \
              --password-stdin \
              --json; then
            echo 'Duplicate OWNER bootstrap unexpectedly succeeded.'
            exit 1
          fi

          printf '%s' "$owner_password" > /tmp/atlas-owner-password
          chmod 600 /tmp/atlas-owner-password

      - name: Verify complete Administrator and API Client Authentication API
        run: |
          pnpm build:packages
          pnpm --filter @atlas/api build
          pnpm --filter @atlas/api start > /tmp/atlas-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; rm -f /tmp/atlas-owner-password' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health/live > /dev/null; then
              break
            fi

            if [ "$attempt" = '30' ]; then
              cat /tmp/atlas-api.log
              exit 1
            fi

            sleep 1
          done

          ATLAS_OWNER_PASSWORD="$(cat /tmp/atlas-owner-password)" \
            node scripts/ci/admin-auth-e2e.mjs

      - name: Verify Content Publication database invariants
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM content_sites")" -ge 1
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM content_publications")" -ge 3
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM content_publications WHERE status = 'active'")" -eq 1
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM (SELECT workspace_id, content_site_id FROM content_publications WHERE status = 'active' GROUP BY workspace_id, content_site_id HAVING count(*) > 1) duplicated")" -eq 0
          test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM (SELECT workspace_id, site_id, slug FROM content_publications WHERE status = 'active' GROUP BY workspace_id, site_id, slug HAVING count(*) > 1) duplicated")" -eq 0

          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "UPDATE content_publications SET body_html = body_html || '<p>mutated</p>' WHERE id = (SELECT id FROM content_publications LIMIT 1)"; then
            echo 'Immutable Publication Snapshot mutation unexpectedly succeeded.' >&2
            exit 1
          fi

          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "DELETE FROM content_publications WHERE id = (SELECT id FROM content_publications LIMIT 1)"; then
            echo 'Immutable Publication Snapshot deletion unexpectedly succeeded.' >&2
            exit 1
          fi
