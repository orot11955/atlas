name: Format Content Asset Picker Once

on:
  push:
    branches:
      - feat/media-content-editor-assets

permissions:
  contents: write

concurrency:
  group: atlas-format-content-asset-picker-once
  cancel-in-progress: false

jobs:
  format-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/media-content-editor-assets
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Content Asset Picker
        run: pnpm exec prettier --write apps/admin-web/src/features/content/content-asset-picker.tsx

      - name: Remove one-time workflow
        run: rm -f .github/workflows/format-content-asset-picker-once.yml

      - name: Commit formatted file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: format Content Asset Picker'
          git push origin HEAD:feat/media-content-editor-assets
