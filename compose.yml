name: atlas

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas-local-password}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - atlas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - atlas

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - atlas-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - atlas

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atlas-root-local-password}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - atlas-minio:/data
    networks:
      - atlas

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atlas-root-local-password}
      MINIO_API_ACCESS_KEY: ${MINIO_API_ACCESS_KEY:-atlas-api}
      MINIO_API_SECRET_KEY: ${MINIO_API_SECRET_KEY:-atlas-api-local-secret}
      MINIO_WORKER_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY:-atlas-worker}
      MINIO_WORKER_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY:-atlas-worker-local-secret}
    entrypoint: ['/bin/sh', '/opt/atlas/init.sh']
    volumes:
      - ./infra/minio/init.sh:/opt/atlas/init.sh:ro
      - ./infra/minio/policies:/opt/atlas/policies:ro
    networks:
      - atlas

  admin-web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_ATLAS_API_URL: /api
      NEXT_PUBLIC_ATLAS_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-atlas_admin_csrf}
      ATLAS_API_INTERNAL_URL: http://api:4000/api
    expose:
      - '3000'
    depends_on:
      api:
        condition: service_started
    networks:
      - atlas

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Seoul}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 4000
      CORS_ORIGINS: http://localhost:${NGINX_PORT:-8080}
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      AUTH_LOGIN_FINGERPRINT_PEPPER: ${AUTH_LOGIN_FINGERPRINT_PEPPER:-atlas-admin-login-fingerprint-local-secret}
      AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-30}
      AUTH_LOGIN_ACCOUNT_LIMIT: ${AUTH_LOGIN_ACCOUNT_LIMIT:-10}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-900}
      AUTH_LOGIN_FAILURE_THRESHOLD: ${AUTH_LOGIN_FAILURE_THRESHOLD:-5}
      AUTH_LOGIN_LOCK_SECONDS: ${AUTH_LOGIN_LOCK_SECONDS:-900}
      AUTH_MFA_CHALLENGE_SECONDS: ${AUTH_MFA_CHALLENGE_SECONDS:-300}
      AUTH_MFA_ENCRYPTION_KEY_BASE64: ${AUTH_MFA_ENCRYPTION_KEY_BASE64:-YXRsYXMtbG9jYWwtbWZhLWVuY3J5cHRpb24ta2V5LTE=}
      AUTH_MFA_ENCRYPTION_KEY_VERSION: ${AUTH_MFA_ENCRYPTION_KEY_VERSION:-local-v1}
      AUTH_MFA_RECOVERY_CODE_PEPPER: ${AUTH_MFA_RECOVERY_CODE_PEPPER:-atlas-admin-recovery-code-local-secret}
      AUTH_MFA_ISSUER: ${AUTH_MFA_ISSUER:-Atlas}
      AUTH_MFA_WINDOW_STEPS: ${AUTH_MFA_WINDOW_STEPS:-1}
      AUTH_MFA_GRANT_SECONDS: ${AUTH_MFA_GRANT_SECONDS:-120}
      AUTH_MFA_RECOVERY_CODE_COUNT: ${AUTH_MFA_RECOVERY_CODE_COUNT:-10}
      AUTH_MFA_FAILURE_THRESHOLD: ${AUTH_MFA_FAILURE_THRESHOLD:-5}
      AUTH_SESSION_FINGERPRINT_PEPPER: ${AUTH_SESSION_FINGERPRINT_PEPPER:-atlas-admin-session-fingerprint-local-secret}
      AUTH_SESSION_IDLE_SECONDS: ${AUTH_SESSION_IDLE_SECONDS:-1800}
      AUTH_SESSION_ABSOLUTE_SECONDS: ${AUTH_SESSION_ABSOLUTE_SECONDS:-43200}
      AUTH_SESSION_TOUCH_SECONDS: ${AUTH_SESSION_TOUCH_SECONDS:-60}
      AUTH_SESSION_MAX_ACTIVE: ${AUTH_SESSION_MAX_ACTIVE:-5}
      AUTH_SESSION_BIND_IP: ${AUTH_SESSION_BIND_IP:-false}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-atlas_admin_session}
      AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-atlas_admin_csrf}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-atlas-api-key-local-pepper-change-me}
      API_KEY_USAGE_TOUCH_SECONDS: ${API_KEY_USAGE_TOUCH_SECONDS:-60}
      WEBHOOK_SECRET_ENCRYPTION_KEY_BASE64: ${WEBHOOK_SECRET_ENCRYPTION_KEY_BASE64:-YXRsYXMtbG9jYWwtd2ViaG9vay1rZXktMjAyNi0wMDA=}
      WEBHOOK_SECRET_ENCRYPTION_KEY_VERSION: ${WEBHOOK_SECRET_ENCRYPTION_KEY_VERSION:-local-v1}
      WEBHOOK_ALLOW_HTTP: ${WEBHOOK_ALLOW_HTTP:-false}
      WEBHOOK_ALLOW_PRIVATE_NETWORK: ${WEBHOOK_ALLOW_PRIVATE_NETWORK:-false}
      WEBHOOK_DELIVERY_TIMEOUT_MS: ${WEBHOOK_DELIVERY_TIMEOUT_MS:-10000}
      WEBHOOK_ENDPOINT_FAILURE_THRESHOLD: ${WEBHOOK_ENDPOINT_FAILURE_THRESHOLD:-5}
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas-local-password}@postgres:5432/${POSTGRES_DB:-atlas}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_API_ACCESS_KEY:-atlas-api}
      MINIO_SECRET_KEY: ${MINIO_API_SECRET_KEY:-atlas-api-local-secret}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-atlas-private}
      MINIO_PROCESSING_BUCKET: ${MINIO_PROCESSING_BUCKET:-atlas-processing}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-atlas-public}
      MINIO_PUBLIC_BASE_URL: http://localhost:${NGINX_PORT:-8080}/assets
    expose:
      - '4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - atlas

  worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Seoul}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas-local-password}@postgres:5432/${POSTGRES_DB:-atlas}
      REDIS_URL: redis://redis:6379/0
      SYSTEM_QUEUE_NAME: ${SYSTEM_QUEUE_NAME:-atlas-system}
      WEBHOOK_SECRET_ENCRYPTION_KEY_BASE64: ${WEBHOOK_SECRET_ENCRYPTION_KEY_BASE64:-YXRsYXMtbG9jYWwtd2ViaG9vay1rZXktMjAyNi0wMDA=}
      WEBHOOK_SECRET_ENCRYPTION_KEY_VERSION: ${WEBHOOK_SECRET_ENCRYPTION_KEY_VERSION:-local-v1}
      WEBHOOK_ALLOW_HTTP: ${WEBHOOK_ALLOW_HTTP:-false}
      WEBHOOK_ALLOW_PRIVATE_NETWORK: ${WEBHOOK_ALLOW_PRIVATE_NETWORK:-false}
      WEBHOOK_DELIVERY_TIMEOUT_MS: ${WEBHOOK_DELIVERY_TIMEOUT_MS:-10000}
      WEBHOOK_ENDPOINT_FAILURE_THRESHOLD: ${WEBHOOK_ENDPOINT_FAILURE_THRESHOLD:-5}
      OUTBOX_RELAY_POLL_MS: ${OUTBOX_RELAY_POLL_MS:-1000}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-50}
      OUTBOX_CLAIM_TIMEOUT_SECONDS: ${OUTBOX_CLAIM_TIMEOUT_SECONDS:-300}
      OUTBOX_RELAY_MAX_ATTEMPTS: ${OUTBOX_RELAY_MAX_ATTEMPTS:-10}
      EVENTING_QUEUE_CONCURRENCY: ${EVENTING_QUEUE_CONCURRENCY:-4}
      WEBHOOK_DELIVERY_POLL_MS: ${WEBHOOK_DELIVERY_POLL_MS:-1000}
      WEBHOOK_DELIVERY_BATCH_SIZE: ${WEBHOOK_DELIVERY_BATCH_SIZE:-25}
      WEBHOOK_DELIVERY_CLAIM_TIMEOUT_SECONDS: ${WEBHOOK_DELIVERY_CLAIM_TIMEOUT_SECONDS:-300}
      WEBHOOK_RESPONSE_MAX_BYTES: ${WEBHOOK_RESPONSE_MAX_BYTES:-4096}
      PUBLICATION_SCHEDULE_POLL_MS: ${PUBLICATION_SCHEDULE_POLL_MS:-1000}
      PUBLICATION_SCHEDULE_BATCH_SIZE: ${PUBLICATION_SCHEDULE_BATCH_SIZE:-25}
      PUBLICATION_SCHEDULE_CLAIM_TIMEOUT_SECONDS: ${PUBLICATION_SCHEDULE_CLAIM_TIMEOUT_SECONDS:-300}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY:-atlas-worker}
      MINIO_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY:-atlas-worker-local-secret}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-atlas-private}
      MINIO_PROCESSING_BUCKET: ${MINIO_PROCESSING_BUCKET:-atlas-processing}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-atlas-public}
      MINIO_PUBLIC_BASE_URL: http://localhost:${NGINX_PORT:-8080}/assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - atlas

  nginx:
    profiles: ['app']
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-8080}:80'
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - admin-web
      - api
      - minio
    networks:
      - atlas

volumes:
  atlas-postgres:
  atlas-redis:
  atlas-minio:

networks:
  atlas:
    driver: bridge
